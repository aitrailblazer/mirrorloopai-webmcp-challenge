  <script type="module">
    import { LitElement, html, css } from "https://unpkg.com/lit@3/index.js?module";
    const scenarios = "<article class=\"scenario\">\n  <div class=\"number\">01</div>\n  <div>\n    <h3>Founder equity and governance deadlock</h3>\n    <p><strong>Dilemma.</strong> Two founders need a safer way to structure a difficult equity or control conversation.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> Start a focused reflection, then retrieve Card 002 · The Horizon Contract and Card 006 · Future Geometry.</p>\n    <p><strong>Bounded action.</strong> Draft one time-limited governance experiment with a review date, explicit scope, and reversible exit. A lawyer must review legal terms.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> No Blue Ray score, legal conclusion, automatic vesting contract, or Card 006 “Fracture Path” claim.</p>\n    <code>start_reflection → get_card(002) → get_card(006)</code>\n  </div>\n</article>\n<article class=\"scenario\">\n  <div class=\"number\">02</div>\n  <div>\n    <h3>Over-simulation off-ramp</h3>\n    <p><strong>Dilemma.</strong> An operator has too many tabs and analyses open and wants one smaller next step.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> Retrieve Card 004 · Future Noise and read its public bounded action.</p>\n    <p><strong>Bounded action.</strong> Test one smaller reversible version and record whether the same evidenced risk appears.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> Reflective support, not a screen-fatigue diagnosis; no transit clock, Mercury hour, forced completion, or physical deck.</p>\n    <code>get_card(004)</code>\n  </div>\n</article>\n<article class=\"scenario\">\n  <div class=\"number\">03</div>\n  <div>\n    <h3>Product-launch inertia</h3>\n    <p><strong>Dilemma.</strong> A creator has delayed contact with real users while waiting for completeness.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> Retrieve Card 001 · Future-First Thinking and use its public Mirror prompt and Loop action.</p>\n    <p><strong>Bounded action.</strong> Choose one reversible launch probe, then compare what became clearer with what remained uncertain.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> No d₄/d₉ diagnostic score and no private Geneva marginalia or hidden interpretation is returned.</p>\n    <code>get_card(001)</code>\n  </div>\n</article>\n<article class=\"scenario\">\n  <div class=\"number\">04</div>\n  <div>\n    <h3>Explicit ten-minute sprint frame</h3>\n    <p><strong>Dilemma.</strong> A team wants a short standup frame without pretending that a clock chose its priorities.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> The human explicitly selects Card 003 · The First Vector as the meeting lens.</p>\n    <p><strong>Bounded action.</strong> Each engineer names the smallest meaningful probe that could change information, access, or momentum.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> The card is chosen by the team—not by a celestial transit, Mercury hour, or astronomical calculation.</p>\n    <code>get_card(003)</code>\n  </div>\n</article>\n<article class=\"scenario\">\n  <div class=\"number\">05</div>\n  <div>\n    <h3>Current-session contradiction review</h3>\n    <p><strong>Dilemma.</strong> A participant wants to see the pattern in choices they already confirmed.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> Review the current browser session’s confirmed answer records.</p>\n    <p><strong>Bounded action.</strong> Use the visible answers as conversation material; independently run each participant’s reflection before any consensual comparison.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> No access to another person’s session, no automatic Counterpoint Matrix, and no organizational diagnosis.</p>\n    <code>review_reflection_answers</code>\n  </div>\n</article>\n<article class=\"scenario\">\n  <div class=\"number\">06</div>\n  <div>\n    <h3>Digital workspace reference</h3>\n    <p><strong>Dilemma.</strong> A visitor wants a persistent visual reference related to ARC 01.</p>\n    <p><strong>Reproducible WebMCP flow.</strong> Recommend the ARC 01 Mono digital edition as an optional workspace reference.</p>\n    <p><strong>Bounded action.</strong> The human may review the collection page and decide whether to open Stripe Checkout.</p>\n    <p class=\"boundary\"><strong>Boundary.</strong> The current product is digital—not a 350gsm physical deck. The tool states no price and performs no cart or payment action.</p>\n    <code>recommend_card_edition(ARC 01, mono)</code>\n  </div>\n</article>";
    const results = "<tr>\n  <td><code>usecase-founder-governance</code></td>\n  <td>start_reflection → get_card → get_card</td>\n  <td>start_reflection → get_card → get_card</td>\n  <td class=\"pass\">PASS</td>\n</tr>\n<tr>\n  <td><code>usecase-over-simulation</code></td>\n  <td>get_card</td>\n  <td>get_card</td>\n  <td class=\"pass\">PASS</td>\n</tr>\n<tr>\n  <td><code>usecase-launch-inertia</code></td>\n  <td>get_card</td>\n  <td>get_card</td>\n  <td class=\"pass\">PASS</td>\n</tr>\n<tr>\n  <td><code>usecase-explicit-sprint-frame</code></td>\n  <td>get_card</td>\n  <td>get_card</td>\n  <td class=\"pass\">PASS</td>\n</tr>\n<tr>\n  <td><code>usecase-current-session-review</code></td>\n  <td>review_reflection_answers</td>\n  <td>review_reflection_answers</td>\n  <td class=\"pass\">PASS</td>\n</tr>\n<tr>\n  <td><code>usecase-digital-workspace-anchor</code></td>\n  <td>recommend_card_edition</td>\n  <td>recommend_card_edition</td>\n  <td class=\"pass\">PASS</td>\n</tr>";
