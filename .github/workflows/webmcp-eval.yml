name: WebMCP evaluation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  webmcp-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install locked dependencies
        run: npm ci

      - name: Run WebMCP evaluation
        run: npm run test:webmcp
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload evaluation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-evaluation
          path: artifacts/webmcp-eval/latest.json
          if-no-files-found: warn
