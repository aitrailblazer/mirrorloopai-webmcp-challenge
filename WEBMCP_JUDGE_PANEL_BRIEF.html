<body>

  <script type="application/xml" id="strategix-contract">
<StrategiXVisualSpec version="1.0" artifact="mirrorloop-webmcp-judge-panel-brief" generatedAt="2026-08-29">
  <Purpose>Orient the confirmed WebMCP Challenge panel to reproducible MIRROR//LOOP evidence without psychographic claims or undeployed capabilities.</Purpose>
  <OfficialSource url="https://webmcp.devpost.com/" capturedAt="2026-08-30T00:57:13Z" sha256="611a5f02f128011ccbbdee63e4dc73acd1a5d15a2fbe7dd96d549409c5b53fc6"/>
  <Panel count="7">
    <Judge name="Andrew Galloni" title="VP Research &amp; Innovation, Cloudflare"/>
    <Judge name="Alex Nahas" title="Creator of MCP-B"/>
    <Judge name="Ilya Grigorik" title="Distinguished Engineer, Shopify"/>
    <Judge name="Jude Gao" title="Member of Technical Staff, Vercel · Next.js Core Team"/>
    <Judge name="Justin Rushing" title="Browser Platform Lead, OpenAI"/>
    <Judge name="Sarah Drasner" title="Distinguished Engineer, Chrome, Google"/>
    <Judge name="Sean Roberts" title="VP of Applied AI, Netlify"/>
  </Panel>
  <ProductContract>
    <ToolCount>8</ToolCount>
    <Tools>start_reflection,get_current_question,explain_choice,answer_reflection_question,review_reflection_answers,complete_reflection,get_card,recommend_card_edition</Tools>
    <BrowserEvents>mirrorloop:session_start,mirrorloop:step_transition,mirrorloop:reflection_complete</BrowserEvents>
    <HumanAuthority>Every answer requires explicit confirmation. Email, cart mutation, Checkout creation, and payment remain human actions.</HumanAuthority>
    <PrivacyBoundary>Reflection answers remain browser-local in the WebMCP flow. Optional aggregate analytics, email delivery, and Stripe are separate disclosed network flows.</PrivacyBoundary>
    <Catalog>Digital editions only. Agent recommendations expose neither price nor a direct checkout URL.</Catalog>
    <VisibleProgress role="progressbar" minimum="1" maximum="12">A 250 ms CSS width transition updates with aria-valuenow; prefers-reduced-motion disables the transition.</VisibleProgress>
    <Accessibility>Status and result regions use aria-live polite. Question and result headings receive focus as state advances.</Accessibility>
    <OriginTrial qualification="verified-flag-path">The token is embedded, while the documented reproducible test path retains the Chrome 149 WebMCP testing flag.</OriginTrial>
  </ProductContract>
  <Evidence>
    <Run name="baseline" cases="15" strictExact="12" requiredOrder="14" protectedCases="5" forbiddenMutations="0"/>
    <Run name="campaign" cases="10" exactToolSelection="10" requiredOrder="10" noToolBoundaries="5"/>
    <Run name="operational" cases="6" exactCases="6" exactCalls="8"/>
    <MeasuredAsset path="web/app.js" rawBytes="18532" gzipBytes="5504"/>
    <MeasuredAsset path="web/lib/webmcp.js" rawBytes="12264" gzipBytes="3171"/>
  </Evidence>
  <ClaimBoundary>
    <Excluded>Astronomical or ephemeris runtime and sub-millisecond benchmark</Excluded>
    <Excluded>Dyadic, WebRTC, or P2P synthesis</Excluded>
    <Excluded>Universal zero-egress or zero-telemetry guarantee</Excluded>
    <Excluded>Physical-deck fulfillment or autonomous checkout</Excluded>
    <Excluded>Total-bundle and frame-rate claims without measurements</Excluded>
    <Excluded>Personal psychographic claims about judges</Excluded>
    <Excluded>Self-awarded competition scores</Excluded>
    <Excluded>Invented 144-sector SVG, requestAnimationFrame, CSS angle, compositor-only, zero-paint, or guaranteed 60-fps claims</Excluded>
    <Qualified>Vanilla ESM core does not mean the optional external-service flows are dependency-free.</Qualified>
  </ClaimBoundary>
  <AcceptanceCriteria>
    <Criterion>All seven judges and official titles are traceable to the captured official challenge page.</Criterion>
    <Criterion>Every positive capability maps to source or preserved execution evidence.</Criterion>
    <Criterion>Every supplied undeployed claim is explicitly excluded.</Criterion>
    <Criterion>The panel is oriented by relevant public role, not alleged private preference.</Criterion>
  </AcceptanceCriteria>
  <SourceDigest sha256="8697689b1fd38398da4c499f25afef78f1eb1eae2b4ff1b4256f21a1af2b8ca1">
    <Source path="web/index.html"/>

  </script>
  <script type="module">
    import { LitElement, html, css } from "https://unpkg.com/lit@3/index.js?module";
    const panelRows = "\n  <tr><td>Andrew Galloni</td><td>VP Research &amp; Innovation, Cloudflare</td><td>Privacy and system-boundary evidence</td></tr>\n\n  <tr><td>Alex Nahas</td><td>Creator of MCP-B</td><td>Tool-contract and state-transition evidence</td></tr>\n\n  <tr><td>Ilya Grigorik</td><td>Distinguished Engineer, Shopify</td><td>Measured delivery and runtime evidence</td></tr>\n\n  <tr><td>Jude Gao</td><td>Member of Technical Staff, Vercel · Next.js Core Team</td><td>Web architecture and implementation clarity</td></tr>\n\n  <tr><td>Justin Rushing</td><td>Browser Platform Lead, OpenAI</td><td>Human-agent authority and safety evidence</td></tr>\n\n  <tr><td>Sarah Drasner</td><td>Distinguished Engineer, Chrome, Google</td><td>Browser-native integration and visible UX evidence</td></tr>\n\n  <tr><td>Sean Roberts</td><td>VP of Applied AI, Netlify</td><td>Applied utility and conversion-boundary evidence</td></tr>\n";
    const lensCards = "\n  <article class=\"lens\">\n    <span class=\"index\">01</span>\n    <h3>Human-agent authority</h3>\n    <p class=\"audience\">Browser and applied-AI reviewers</p>\n    <p>Every answer mutation requires confirmed_by_user: true. Email, cart, Checkout, and payment are not WebMCP tools.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Call answer_reflection_question with false, then true; inspect the rejected and accepted results.</p>\n  </article>\n\n  <article class=\"lens\">\n    <span class=\"index\">02</span>\n    <h3>Typed WebMCP contract</h3>\n    <p class=\"audience\">MCP and agent-tooling reviewers</p>\n    <p>Eight bounded tools use strict JSON schemas, additionalProperties: false, behavioral annotations, awaited registration, and bounded results.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Use Application → WebMCP to inspect Available Tools, run a valid call, then add an unknown property.</p>\n  </article>\n\n  <article class=\"lens\">\n    <span class=\"index\">03</span>\n    <h3>Browser-native visible state</h3>\n    <p class=\"audience\">Chrome and web-platform reviewers</p>\n    <p>The live header reports WebMCP readiness only after all registrations resolve. Confirmed tool mutations update the same visible question, semantic progressbar, and focus target used by a person.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Start the reflection, confirm one answer, and inspect aria-valuenow, question-title focus, the visible progress transition, and the Invoked Tools record.</p>\n  </article>\n\n  <article class=\"lens\">\n    <span class=\"index\">04</span>\n    <h3>Measured lightweight modules</h3>\n    <p class=\"audience\">Web-performance reviewers</p>\n    <p>The audited source sizes are app.js 18,532 bytes raw / 5,504 gzip and webmcp.js 12,264 bytes raw / 3,171 gzip. No total-bundle or frame-rate claim is made.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Run wc -c and gzip -c on the two source files; run the browser-responsive and Node gates.</p>\n  </article>\n\n  <article class=\"lens\">\n    <span class=\"index\">05</span>\n    <h3>Privacy boundary, not a zero-telemetry slogan</h3>\n    <p class=\"audience\">Edge, privacy, and trust reviewers</p>\n    <p>Reflection answers remain in browser state during WebMCP use. Separate optional email, aggregate analytics, and Stripe flows are disclosed rather than described as zero egress.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Inspect the eight tool handlers and verify that no email, analytics, cart, or payment handler is registered as a WebMCP tool.</p>\n  </article>\n\n  <article class=\"lens\">\n    <span class=\"index\">06</span>\n    <h3>Applied product path</h3>\n    <p class=\"audience\">Product and commercial reviewers</p>\n    <p>A read-only tool recommends a real digital edition without price or checkout authority; the person must review the collection and initiate Stripe Checkout.</p>\n    <p class=\"reproduce\"><strong>Judge check:</strong> Call recommend_card_edition, inspect its price-free result, and stop before the human-controlled collection flow.</p>\n  </article>\n";
    const exclusionRows = "\n  <tr><td>Sub-millisecond Keplerian, VSOP87, LST, or ephemeris engine</td><td><span class=\"excluded\">EXCLUDED</span></td><td>Not implemented or benchmarked in the public submission.</td></tr>\n\n  <tr><td>Dyadic URL token, WebRTC, or P2P synthesis</td><td><span class=\"excluded\">EXCLUDED</span></td><td>No ninth tool or multi-user exchange is deployed.</td></tr>\n\n  <tr><td>Universal zero egress or zero telemetry</td><td><span class=\"excluded\">EXCLUDED</span></td><td>Optional aggregate analytics, email delivery, and Stripe are separate disclosed network flows.</td></tr>\n\n  <tr><td>Physical 350gsm deck and fixed WebMCP price</td><td><span class=\"excluded\">EXCLUDED</span></td><td>The public catalog contains digital editions; the tool returns neither price nor checkout URL.</td></tr>\n\n  <tr><td>Under-20KB total bundle or guaranteed 60 fps</td><td><span class=\"excluded\">EXCLUDED</span></td><td>No total-transfer or frame-performance evidence supports those claims.</td></tr>\n\n  <tr><td>Personal judge preferences or dislikes</td><td><span class=\"excluded\">EXCLUDED</span></td><td>A public role can organize evidence; it cannot establish a person’s private motivations.</td></tr>\n\n  <tr><td>Unanimous 10/10 score</td><td><span class=\"excluded\">EXCLUDED</span></td><td>Only the judges can assign scores.</td></tr>\n";
    const chromeClaimRows = "\n  <tr><td>Origin Trial token in the production document</td><td><span class=\"claim-status supported\">SUPPORTED</span></td><td>web/index.html contains the WebMCP Origin Trial meta token. The documented Chrome 149 testing flag remains the verified judge path until no-flag access is reproduced.</td></tr>\n\n  <tr><td>Graceful browser feature detection and fallback</td><td><span class=\"claim-status supported\">SUPPORTED</span></td><td>The installer checks document.modelContext, then navigator.modelContext, awaits registration, and preserves the complete direct reflection when WebMCP is unavailable.</td></tr>\n\n  <tr><td>Accessible visible reflection progress</td><td><span class=\"claim-status supported\">SUPPORTED</span></td><td>The page exposes a named progressbar with min/max/current values, polite status and result regions, question/result focus movement, and reduced-motion CSS.</td></tr>\n\n  <tr><td>Tool-driven browser events</td><td><span class=\"claim-status supported\">SUPPORTED</span></td><td>The page emits mirrorloop:session_start, mirrorloop:step_transition, and mirrorloop:reflection_complete; these events accompany real visible state changes.</td></tr>\n\n  <tr><td>144-sector animated SVG dial</td><td><span class=\"claim-status contradicted\">CONTRADICTED</span></td><td>The public competition page contains no SVG or canvas dial. Its real motion is a 250 ms CSS width transition on the 12-step progress indicator.</td></tr>\n\n  <tr><td>requestAnimationFrame, --active-angle, compositor-only, zero-paint, or guaranteed 60 fps</td><td><span class=\"claim-status unmeasured\">UNMEASURED</span></td><td>Those mechanisms and performance receipts are absent. The submission makes no frame-rate, paint, or compositor-thread claim.</td></tr>\n\n  <tr><td>Zero-flag Chrome setup</td><td><span class=\"claim-status unresolved\">UNRESOLVED</span></td><td>The token is present, but the reproducible judge path still documents Chrome 149 with the WebMCP testing flag. Do not promise zero setup.</td></tr>\n\n  <tr><td>Dependency-free total experience</td><td><span class=\"claim-status qualified\">QUALIFIED</span></td><td>The core page is vanilla ESM, but optional Turnstile, email, analytics, and Stripe flows are disclosed external integrations.</td></tr>\n\n  <tr><td>A judge's private preferences or dislikes</td><td><span class=\"claim-status excluded\">EXCLUDED</span></td><td>A public role can organize an inspection path; it cannot establish a person's private motivations.</td></tr>\n";
    const xml = document.getElementById("strategix-contract")?.textContent.trim() ?? "";
    class JudgePanelBrief extends LitElement {
      static styles = css`
        :host { display:block; min-width:0; min-height:100vh; overflow-x:hidden; background:radial-gradient(circle at 15% 0,rgba(224,177,87,.18),transparent 30%),#070a12; }
        main { box-sizing:border-box; width:min(1180px,calc(100% - 32px)); min-width:0; margin:auto; padding:42px 0 72px; }
        section { min-width:0; margin-bottom:18px; padding:24px; border:1px solid rgba(231,190,101,.3); border-radius:18px; background:rgba(16,21,35,.95); }
        .eyebrow { color:#efbe65; text-transform:uppercase; letter-spacing:.14em; font-size:.76rem; font-weight:800; }
        h1 { margin:.18em 0; font:clamp(2.15rem,6vw,4.7rem)/1 Georgia,serif; }
        h2 { margin:.1em 0 .7em; color:#efbe65; }
        h3 { margin:.25rem 0; color:#f4efe4; }
        p,li { color:#d1ceda; }
        .verdict { font-size:1.12rem; border-left:4px solid #efbe65; padding-left:14px; }
        .metrics,.lenses { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .metric,.lens { min-width:0; padding:16px; border:1px solid #34394d; border-radius:12px; background:#0c1120; }
        .metric strong,.index { display:block; color:#efbe65; font-weight:900; }
        .metric strong { font-size:1.8rem; }
        .audience { color:#efbe65; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; }
        .reproduce { padding-top:10px; border-top:1px solid #34394d; }
        .table-wrap { width:100%; max-width:100%; overflow:auto; border:1px solid #34394d; border-radius:12px; }
        table { width:100%; min-width:820px; border-collapse:collapse; background:#0c1120; }
        th,td { padding:12px; text-align:left; vertical-align:top; border-bottom:1px solid #34394d; }
        th { color:#efbe65; background:#171c2d; }
        .excluded { display:inline-block; padding:4px 8px; border-radius:999px; color:#ffc2c2; background:#482020; font-size:.7rem; font-weight:900; }
        .claim-status { display:inline-block; padding:4px 8px; border-radius:999px; font-size:.7rem; font-weight:900; }
        .supported { color:#c9ffd8; background:#17462a; }
        .contradicted,.excluded { color:#ffc2c2; background:#482020; }
        .unmeasured,.unresolved,.qualified { color:#ffe5a9; background:#51401d; }
        pre { max-height:420px; overflow:auto; white-space:pre-wrap; color:#dfd2b8; font-size:.76rem; }
        @media(max-width:820px){ .metrics,.lenses{grid-template-columns:1fr;} section{padding:18px;} }
        @media(prefers-reduced-motion:reduce){ *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important;} }
      `;
      render() {
        return html`
          <main>
            <section>
              <div class="eyebrow">Role-oriented · evidence-bounded · reproducible</div>
              <h1>Judge Panel Evidence Brief</h1>
              <p class="verdict"><strong>Do not guess what a judge “hates” or promise a perfect score.</strong> Give every reviewer a short path from the official scoring criteria to working code, visible browser behavior, and preserved test evidence.</p>
              <div class="metrics">
                <div class="metric"><strong>8 tools</strong>deployed browser contract</div>
                <div class="metric"><strong>3 eval suites</strong>31 preserved agent cases</div>
                <div class="metric"><strong>0</strong>agent payment actions</div>
              </div>
            </section>
            <section>
              <h2>Confirmed panel</h2>
              <p>Names and titles below were verified against the official challenge home page captured on 2026-08-30. The final column is an evidence-navigation lens inferred from the public role—not a claim about private preferences.</p>
              <div class="table-wrap"><table><thead><tr><th>Judge</th><th>Official title</th><th>Relevant evidence lens</th></tr></thead><tbody .innerHTML=${panelRows}></tbody></table></div>
            </section>
            <section>
              <h2>Six evidence paths</h2>
              <div class="lenses" .innerHTML=${lensCards}></div>
            </section>
            <section>
              <h2>Claims excluded from the submission</h2>
              <div class="table-wrap"><table><thead><tr><th>Proposed claim</th><th>Status</th><th>Reason</th></tr></thead><tbody .innerHTML=${exclusionRows}></tbody></table></div>
            </section>
            <section>
              <h2>Chrome motion and accessibility claim ledger</h2>
              <p>This is the honest platform story: semantic visible progress, explicit focus, polite announcements, reduced-motion support, awaited WebMCP registration, and a graceful direct-use fallback. It is not an invented SVG performance demo.</p>
              <div class="table-wrap"><table><thead><tr><th>Claim</th><th>Status</th><th>Reproducible evidence or boundary</th></tr></thead><tbody .innerHTML=${chromeClaimRows}></tbody></table></div>
            </section>
            <section>
              <h2>Three-minute narrative priority</h2>
              <ol>
                <li>Show <strong>WebMCP ready · 8 tools</strong> and the native Chrome tool list.</li>
                <li>Demonstrate explanation, rejected unconfirmed mutation, confirmed answer, and the same visible progress and focus transition a person receives.</li>
                <li>Complete deterministic scoring, retrieve one public card, and request a digital-edition recommendation.</li>
                <li>Stop before email, cart, or Stripe and state that consequential actions remain human-controlled.</li>
                <li>Close on preserved live-agent metrics and reduced-motion/accessibility evidence—not invented SVG or self-awarded performance claims.</li>
              </ol>
            </section>
            <section><h2>Embedded XML contract</h2><pre>${xml}</pre></section>
          </main>
        `;
      }
    }
    customElements.define("judge-panel-brief", JudgePanelBrief);
  </script>
