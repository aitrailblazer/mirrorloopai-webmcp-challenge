<!doctype html>

<head>

  <title>MIRROR//LOOP — WebMCP Demo Shot List</title>
  <meta name="description" content="Evidence-bounded 2:32 recording and synchronization contract for the MIRROR//LOOP WebMCP Challenge demo.">
  <style>
    html { background:#070a12; color:#f6f0e2; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; }
    body { margin:0; min-height:100vh; }
    demo-shot-list:not(:defined) { display:block; width:min(1180px,calc(100% - 32px)); margin:auto; padding:40px 0; }
  </style>
</head>
<body>
  <demo-shot-list></demo-shot-list>

  <script id="strategix-contract" type="application/xml">
<StrategiXVisualSpec version="1.0" artifact="mirrorloop-webmcp-demo-shot-list" generatedAt="2026-08-30" status="recording-ready">
  <CanonicalArtifact>
    <Path>WEBMCP_DEMO_SHOT_LIST.html</Path>
    <Owner>MIRROR//LOOP</Owner>
    <Duration target="152" verified="152.283" maximum="180" unit="seconds"/>
  </CanonicalArtifact>
  <Purpose>Provide a second-by-second recording contract that demonstrates only deployed, reproducible MIRROR//LOOP WebMCP behavior.</Purpose>
  <ProductContract>
    <LiveOrigin>https://mirrorloopai.com/</LiveOrigin>
    <ToolCount>11</ToolCount>
    <Tools>start_reflection,get_current_question,explain_choice,compare_choices,preview_answer_impact,answer_reflection_question,review_reflection_answers,complete_reflection,export_reflection_dossier,get_card,recommend_card_edition</Tools>
    <HumanAuthority>Answers require confirmed_by_user true. Email, cart mutation, Checkout creation, and payment remain human actions.</HumanAuthority>
    <CatalogBoundary>Edition recommendations are read-only, digital, and price-free.</CatalogBoundary>
  </ProductContract>
  <VerifiedCoreRepositoryScope>
    <Capability id="typed-tools">Eleven typed tools use closed JSON Schemas, bounded runtime validation, and structured tool errors.</Capability>
    <Capability id="human-confirmation">answer_reflection_question requires confirmed_by_user true before recording or revising a choice.</Capability>
    <Capability id="deterministic-scoring">Exactly twelve answers are scored in the browser with stable ascending-code tie-breaking and no cloud computation for scoring.</Capability>
    <Capability id="public-card-matrix">get_card exposes curated public metadata for Cards 001 through 144 without publishing private prompts or corpora.</Capability>
    <Capability id="commerce-boundary">recommend_card_edition is read-only and exposes no price, cart mutation, Checkout creation, or payment action.</Capability>
    <Capability id="chrome-deployment">The production origin includes the WebMCP Origin Trial token, has been observed in Chrome DevTools, and is covered by automated registration and contract gates.</Capability>
  </VerifiedCoreRepositoryScope>
  <Workflow>
    <Beat start="0:00" end="0:13" tool="none">Introduce AITrailblazer, the MIRROR//LOOP identity and logo, the 2026 WebMCP Challenge, its human-agent purpose, and copyright.</Beat>
    <Beat start="0:13" end="0:28" tool="none">Explain MIRROR//LOOP's value in a stressed environment crowded with generic pseudo-solutions.</Beat>
    <Beat start="0:28" end="0:40" tool="none">Explain the website challenge: twelve questions and 144 cards create comprehension and navigation friction.</Beat>
    <Beat start="0:40" end="0:52" tool="none">Define WebMCP as trusted site-owned capabilities that replace scraping and interface guesswork.</Beat>
    <Beat start="0:52" end="1:03" tool="none">Present the MIRROR//LOOP competition entry: one human interface, one bounded agent interface, and eleven tools over shared browser state.</Beat>
    <Beat start="1:03" end="1:13" tool="none">Show WebMCP ready · 11 tools and focus the visible Agent State rail.</Beat>
    <Beat start="1:13" end="1:29" tool="start_reflection,get_current_question,compare_choices">Start the reflection, retrieve only the current question, and contrast two choices without selecting either.</Beat>
    <Beat start="1:29" end="1:41" tool="answer_reflection_question">Show rejection when confirmed_by_user false is supplied, then confirm and visibly advance.</Beat>
    <Beat start="1:41" end="1:50" tool="complete_reflection">Complete deterministic browser scoring from twelve human-confirmed answers.</Beat>
    <Beat start="1:50" end="2:03" tool="preview_answer_impact,get_card">Preview one hypothetical change without mutation, then retrieve one exact record from the 144-card public matrix.</Beat>
    <Beat start="2:03" end="2:20" tool="recommend_card_edition,export_reflection_dossier">Recommend a digital edition without commerce authority, then download a confirmed local dossier.</Beat>
    <Beat start="2:20" end="2:32" tool="none">Hold a dedicated end card with the human-authority boundary and public destinations.</Beat>
  </Workflow>
  <MediaSynchronization>
    <Voice engine="Apple Speech Synthesis" name="Ava (Premium)" rate="175" unit="words-per-minute"/>
    <Timeline source="docs/demo/scenes.json" scenes="16"/>
    <Captions format="SRT" cues="36" maximumLinesPerCue="2" maximumCharactersPerLine="42" style="open-yellow" safeArea="dedicated-180px-lower-band"/>
    <Highlighting>Each scene drives a gold focus frame, dimmed surround, and plain-language explanation rail around the relevant interface state.</Highlighting>
    <MeasuredSync audioVideoDriftMilliseconds="1" sceneTimingToleranceMilliseconds="3"/>
  </MediaSynchronization>
  <DataOrAPIContract>
    <InputBoundary>Use only non-sensitive demonstration text and enumerated tool arguments.</InputBoundary>
    <OutputBoundary>Do not show email addresses, tokens, payment details, secret dashboards, or private corpora.</OutputBoundary>
    <BrowserState>The demonstrated reflection state is ephemeral browser state.</BrowserState>
  </DataOrAPIContract>
  <Diagrams>
    <Diagram id="authority-flow">Human intent to WebMCP tool to visible page state, with email, cart, Checkout, and payment outside agent authority.</Diagram>
  </Diagrams>
  <AcceptanceCriteria>
    <Criterion>The final public YouTube video is shorter than three minutes.</Criterion>
    <Criterion>The recording uses Apple Ava Premium narration with natural sentence pacing and measured pauses.</Criterion>
    <Criterion>Narration, captions, explanation rail, and visible focus highlighting share the canonical scene timeline.</Criterion>
    <Criterion>The final audio/video drift is no more than 75 milliseconds and captions end within the narration.</Criterion>
    <Criterion>The live page visibly reports WebMCP ready · 11 tools.</Criterion>
    <Criterion>DevTools displays exactly the eleven production tools without schema errors.</Criterion>
    <Criterion>Act I contrasts coordination burden rather than claiming that a standalone model was measured and failed.</Criterion>
    <Criterion>The unconfirmed answer is rejected and the confirmed answer visibly advances the page.</Criterion>
    <Criterion>No unsupported P2P, astronomy, physical fulfillment, x402, zero-egress, bundle-size, frame-rate, or judge-preference claim appears.</Criterion>
    <Criterion>The public site, source repository, and video open from a signed-out browser before submission.</Criterion>
  </AcceptanceCriteria>
  <DecisionLog>
    <Decision date="2026-08-30">Use the verified eleven-tool production contract as the complete demo scope.</Decision>
    <Decision date="2026-08-30">Keep proposed P2P, transit-clock, physical-deck, and autonomous-payment concepts out of the submitted build and recording.</Decision>
    <Decision date="2026-08-30">Demonstrate a deliberate rejected mutation because the human-confirmation boundary is more distinctive than an uninterrupted happy path.</Decision>
  </DecisionLog>
  <RisksAndOpenQuestions>
    <Risk>Public YouTube upload, platform caption attachment, and anonymous playback remain operator actions.</Risk>
    <Risk>WebMCP availability is browser-session dependent; verify Chrome and the Application WebMCP panel immediately before recording.</Risk>
    <Risk>A prepared eleven-answer state must not imply that the agent chose the answers; narration must state that the choices were previously confirmed by the demonstrator.</Risk>
  </RisksAndOpenQuestions>
  <SourceDigest>
    <Source path="SUBMISSION.md">Copy-ready project description and verified 2:32 storyboard.</Source>
    <Source path="docs/demo/scenes.json">Canonical narration, caption, focus, and explanation timeline.</Source>
    <Source path="web/lib/webmcp.js">Eleven production tool definitions and authority boundaries.</Source>
    <Source path="WEBMCP_COMPETITION_HARDENING_AUDIT.html">Claim ledger and competition evidence boundary.</Source>
    <Source path="WEBMCP_AGENT_EVAL_REPORT.html">Preserved live-agent evaluation results.</Source>
    <Source path="feature_status_tracker.csv" feature="SUB-005">Canonical demo readiness story.</Source>
  </SourceDigest>
  <ImplementationNotes>
    <Note>The packaged competition candidate is 1440 by 900, H.264 with AAC audio.</Note>
    <Note>Prepare the eleven-answer state before recording the completion segment to stay under three minutes.</Note>
    <Note>Generate speech scene-by-scene so action, caption, spotlight, and spoken explanation remain synchronized.</Note>
  </ImplementationNotes>
</StrategiXVisualSpec>
  </script>

  <script type="module">
    import { LitElement, html, css } from "https://unpkg.com/lit@3/index.js?module";

    const shots = [
      { time:"0:00–0:13", tool:"Identity · competition", visual:"Open on the MIRROR//LOOP logo, AITrailblazer identity, copyright, and The WebMCP Challenge 2026.", voice:"Introduce who we are, what the competition explores, and why safe human-agent cooperation matters.", proof:"A cold viewer immediately knows the entrant, project, competition, and ownership." },
      { time:"0:13–0:28", tool:"MIRROR//LOOP · human problem", visual:"Show a dedicated full-screen card about stress, narrowed attention, and pseudo-solutions.", voice:"Explain how twelve everyday questions reveal one response pattern and one practical next step without diagnosis.", proof:"The product and the problem it solves are understandable before any technology appears." },
      { time:"0:28–0:40", tool:"Website challenge", visual:"Show the comprehension burden of twelve questions, 144 cards, and unfamiliar meanings.", voice:"Explain why a useful website can still create form fatigue and navigation friction.", proof:"The reason an agent interface is needed is explicit." },
      { time:"0:40–0:52", tool:"WebMCP solution", visual:"Show the typed site-owned capability contract.", voice:"Define WebMCP as discoverable tools with validated inputs and structured results, replacing scraping and guesswork.", proof:"The protocol is justified by the website problem." },
      { time:"0:52–1:03", tool:"Competition entry", visual:"Show one experience, two interfaces, and eleven bounded tools.", voice:"Explain the division of authority: agent clarifies and navigates, browser scores, person confirms.", proof:"The entry's WebMCP leverage is explicit." },
      { time:"1:03–1:13", tool:"Registration", visual:"Reveal the live origin, frame “WebMCP ready · 11 tools,” and open the Agent State rail.", voice:"The Agent State rail makes registration and tool execution visible without DevTools.", proof:"The live site and readiness state are visible." },
      { time:"1:13–1:29", tool:"start_reflection · get_current_question · compare_choices", visual:"Focus the quiz as the agent starts, reads Question 1, and contrasts two choices.", voice:"The page owns session state. The comparison clarifies meaning without ranking, selecting, or recording.", proof:"The visible question and tool result agree; no answer is selected." },
      { time:"1:29–1:41", tool:"answer_reflection_question", visual:"Move focus to the lifecycle rail for the rejected call, then back to the quiz for the confirmed advance.", voice:"An unconfirmed mutation fails. Only explicit human confirmation advances the flow.", proof:"The rejection and confirmed transition are both visible." },
      { time:"1:41–1:50", tool:"complete_reflection", visual:"Focus the Horizon Signal result after the twelve human-confirmed answers complete.", voice:"The deterministic browser scorer—not the agent—produces the result.", proof:"Exactly twelve confirmed answers complete successfully." },
      { time:"1:50–2:03", tool:"preview_answer_impact · get_card", visual:"Focus the lifecycle rail for the provisional preview and exact public-card lookup.", voice:"A hypothetical answer is simulated without saving; one curated card is retrieved from the 144-card matrix.", proof:"Saved state remains unchanged and the exact card record is returned." },
      { time:"2:03–2:20", tool:"recommend_card_edition · export_reflection_dossier", visual:"Focus the matching edition, then export activity and downloaded local receipt.", voice:"Discovery stays price-free and read-only. Confirmed export creates a local dossier without email or an account.", proof:"No cart or payment action occurs; the local file download completes." },
      { time:"2:20–2:32", tool:"Human authority close", visual:"Hold a dedicated MIRROR//LOOP end card with the live site, public source, MIT license, and human-control statement.", voice:"Meaning, identity, communication, cart, and payment remain under human control.", proof:"The close gives judges clear destinations without unsupported claims." }
    ];

    const excluded = [
      ["P2P / WebRTC / evaluateDyad", "Not deployed in this repository."],
      ["Keplerian, VSOP87, LST, or transit clock", "No public engine or benchmark exists in the submitted build."],
      ["Physical 350gsm deck fulfillment", "The WebMCP catalog contract is digital and read-only."],
      ["x402 or autonomous payment", "Stripe remains a separate human-controlled flow."],
      ["Zero telemetry, zero egress, or zero knowledge", "Absolute infrastructure and privacy guarantees are not established."],
      ["Under 20KB or 60fps", "No qualifying bundle or frame-rate benchmark supports these claims."],
      ["Judge preference profiles", "Public roles may organize evidence; private preferences are not inferred."]
    ];

    const verifiedCore = [
      ["Eleven typed tools", "Closed JSON Schemas, bounded runtime checks, and structured tool errors."],
      ["Human confirmation", "confirmed_by_user: true is required before recording or revising a choice."],
      ["Deterministic scoring", "Twelve answers are scored in the browser with stable ascending-code tie-breaking; scoring uses no cloud compute."],
      ["144-card public matrix", "get_card returns curated Cards 001–144 without private prompts or corpora."],
      ["Safe commerce boundary", "Digital-edition discovery is read-only; email, cart, Checkout, and payment remain human actions."],
      ["Verified Chrome path", "Production Origin Trial token, observed DevTools discovery, and automated contract gates."]
    ];

    const xml = document.getElementById("strategix-contract")?.textContent.trim() ?? "";

    class DemoShotList extends LitElement {
      static styles = css`
        :host { display:block; min-width:0; min-height:100vh; overflow-x:hidden; background:radial-gradient(circle at 16% 0,rgba(233,183,84,.18),transparent 30%),radial-gradient(circle at 86% 18%,rgba(139,76,204,.13),transparent 26%),#070a12; }
        * { box-sizing:border-box; }
        main { width:min(1180px,calc(100% - 32px)); margin:auto; padding:42px 0 72px; }
        section { margin-bottom:18px; padding:24px; border:1px solid rgba(235,190,99,.28); border-radius:18px; background:rgba(14,19,33,.94); box-shadow:0 22px 70px rgba(0,0,0,.2); }
        .eyebrow { color:#efbd61; text-transform:uppercase; letter-spacing:.16em; font-size:.75rem; font-weight:850; }
        h1 { max-width:900px; margin:.18em 0 .2em; font:clamp(2.4rem,6vw,5rem)/.98 Georgia,serif; }
        h2 { margin:0 0 14px; color:#efbd61; font-size:1.25rem; }
        h3 { margin:0; color:#f6f0e2; }
        p,li,td { color:#d0cddd; }
        .lead { max-width:860px; font-size:1.12rem; }
        .metrics,.authority,.checks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:20px; }
        .metric,.node,.check { padding:15px; border:1px solid #33394e; border-radius:12px; background:#0a1020; }
        .metric strong { display:block; color:#efbd61; font-size:1.8rem; }
        .node strong,.check strong { display:block; color:#efbd61; margin-bottom:5px; }
        .node.boundary { border-color:#b16774; }
        .arrow { align-self:center; justify-self:center; color:#efbd61; font-weight:900; }
        .timeline { display:grid; gap:12px; }
        .shot { display:grid; grid-template-columns:105px 190px minmax(0,1fr); gap:15px; padding:18px; border-left:3px solid #efbd61; border-radius:0 12px 12px 0; background:#0a1020; }
        .time { color:#efbd61; font-weight:900; font-variant-numeric:tabular-nums; }
        .tool { color:#e7dbfa; font-weight:800; overflow-wrap:anywhere; }
        .shot p { margin:.25rem 0; }
        .label { color:#9ca3b8; font-size:.72rem; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }
        .table-wrap { overflow:auto; border:1px solid #33394e; border-radius:12px; }
        table { width:100%; min-width:720px; border-collapse:collapse; background:#0a1020; }
        th,td { padding:12px; text-align:left; vertical-align:top; border-bottom:1px solid #2c3245; }
        th { color:#efbd61; background:#151b2d; }
        .pass { color:#a7edbc; }
        .pending { color:#ffe09a; }
        pre { max-height:430px; overflow:auto; white-space:pre-wrap; color:#dfd3ba; font-size:.76rem; }
        code { color:#dbc8ff; overflow-wrap:anywhere; }
        @media(max-width:820px) {
          .metrics,.authority,.checks { grid-template-columns:1fr; }
          .shot { grid-template-columns:1fr; }
          .arrow { transform:rotate(90deg); }
        }
      `;

      render() {
        return html`
          <main>
            <section>
              <div class="eyebrow">Recording contract · evidence bounded</div>
              <h1>WebMCP Demo Shot List</h1>
              <p class="lead">A synchronized 2:32 walkthrough of the deployed MIRROR//LOOP experience. The opening identifies AITrailblazer and MIRROR//LOOP, explains the competition, the human problem, the website challenge, WebMCP, and this entry before live proof begins. Apple Ava Premium narration, yellow open captions in a dedicated lower safe band, focus highlighting, and the explanation rail follow one canonical 16-scene timeline.</p>
              <div class="metrics">
                <div class="metric"><strong>2:32</strong>verified duration</div>
                <div class="metric"><strong>11</strong>production tools</div>
                <div class="metric"><strong>1 ms</strong>final A/V drift</div>
              </div>
            </section>

            <section>
              <h2>Authority flow</h2>
              <div class="authority">
                <div class="node"><strong>Human</strong>Supplies intent, interprets meaning, confirms every answer, and controls email and purchases.</div>
                <div class="node"><strong>WebMCP agent</strong>Starts, reads, explains, records confirmed choices, reviews, completes, and retrieves.</div>
                <div class="node boundary"><strong>Hard boundary</strong>Email submission, cart mutation, Checkout creation, and payment are not WebMCP tools.</div>
              </div>
            </section>

            <section>
              <h2>Verified core repository scope</h2>
              <div class="checks">
                ${verifiedCore.map(([title, detail]) => html`
                  <div class="check"><strong>${title}</strong>${detail}</div>
                `)}
              </div>
            </section>

            <section>
              <h2>Second-by-second recording plan</h2>
              <div class="timeline">
                ${shots.map(shot => html`
                  <article class="shot">
                    <div class="time">${shot.time}</div>
                    <div class="tool">${shot.tool}</div>
                    <div>
                      <div class="label">Visual</div><p>${shot.visual}</p>
                      <div class="label">Narration</div><p>${shot.voice}</p>
                      <div class="label">Proof on screen</div><p>${shot.proof}</p>
                    </div>
                  </article>
                `)}
              </div>
            </section>

            <section>
              <h2>Claims excluded from the recording</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Do not claim</th><th>Evidence disposition</th></tr></thead>
                  <tbody>${excluded.map(([claim, reason]) => html`<tr><td>${claim}</td><td>${reason}</td></tr>`)}</tbody>
                </table>
              </div>
            </section>

            <section>
              <h2>Recording and publication gate</h2>
              <div class="checks">
                <div class="check"><strong class="pass">Before capture</strong>Use a fresh Chrome profile with WebMCP enabled. Confirm the badge and Application → WebMCP tool list before speaking.</div>
                <div class="check"><strong class="pass">During capture</strong>Record at the verified 1440×900 frame or better. Hide accounts, email, tokens, payment details, private dashboards, and unrelated tabs.</div>
                <div class="check"><strong class="pending">Before submission</strong>Publish on YouTube, keep it public and under three minutes, add accurate captions, test audio, and open it while signed out.</div>
              </div>
              <p><strong>Stop condition:</strong> if the badge does not read <code>WebMCP ready · 11 tools</code>, do not record. Restart the verified Chrome build, reopen the live origin, and recheck Application → WebMCP.</p>
            </section>

            <section>
              <h2>Acceptance checklist</h2>
              <ul>
                <li>All eleven tools are visible and the demo uses only their deployed contracts.</li>
                <li>The rejected unconfirmed answer and successful confirmed answer both appear.</li>
                <li>The prepared state is described as previously human-confirmed, not agent-selected.</li>
                <li>The final recommendation is digital, read-only, and price-free.</li>
                <li>The closing sentence preserves human control of meaning, email, cart, and payment.</li>
                <li>The public video, repository, and live site work from a signed-out browser.</li>
              </ul>
            </section>

            <section>
              <h2>Embedded XML contract</h2>
              <pre>${xml}</pre>
            </section>
          </main>
        `;
      }
    }

    customElements.define("demo-shot-list", DemoShotList);
  </script>
</body>
