  <Purpose>Produce a silent-first pilot proving that viewers can perceive pursuit, reflective pause, and one reversible evidence-producing step without dialogue or expository narration.</Purpose>
  <CanonicalMirror>When clarity remains distant, could one modest step reveal useful information—or is more inquiry genuinely needed first?</CanonicalMirror>
  <CanonicalLoop>Option: test one reversible step, then compare what became clearer with what remained uncertain.</CanonicalLoop>
  <DramaticQuestion>Will Mara chase the completed future or take only the next step she can still reverse?</DramaticQuestion>
  <Screenplay totalSeconds="86" shotCount="12">
    <Shot id="01" time="00:00–00:04" label="CONSEQUENCE BEFORE CONTEXT">
      <Camera>Macro, locked</Camera>
      <Action>The oxidized copper score plate trembles although Mara’s hands are still. Dust rises from one engraved groove.</Action>
      <Sound>Archive room tone; Phrase-Weave II begins below audibility; one metallic sympathetic resonance.</Sound>
      <Meaning>Vox fugiens appears first as an unexplained future signal.</Meaning>
    </Shot>
    <Shot id="02" time="00:04–00:10" label="THE SOURCE CARD">
      <Camera>Straight-on plate</Camera>
      <Action>Original Card 001 fills frame, fully intact and readable. No redrawn typography. A narrow highlight travels only along the existing central glyph.</Action>
      <Sound>Exact Phrase-Weave II rises; no added melody.</Sound>
      <Meaning>The audience sees the governing card before interpretation begins.</Meaning>
    </Shot>
    <Shot id="03" time="00:10–00:18" label="CARD BECOMES SPACE">
      <Camera>Slow axial push</Camera>
      <Action>The card remains planar for two seconds. Its existing gold lines lift like engraved wire; paper grain becomes floor; the central vector extends into a copper corridor.</Action>
      <Sound>High moving texture separates from the score as original sound design; paper fiber, metal tension.</Sound>
      <Meaning>Transformation originates from the real card rather than replacing it.</Meaning>
    </Shot>
    <Shot id="04" time="00:18–00:27" label="THE UNPLAYED NOTE">
      <Camera>Medium to macro</Camera>
      <Action>Mara lowers her burin. A held resonance makes the plate glow. Her reflection in the copper is older by a decade, but Mara herself has not moved.</Action>
      <Sound>Held brass resonance; fluorescent hum falls away.</Sound>
      <Meaning>Possibility becomes visible but supplies no new factual knowledge.</Meaning>
    </Shot>
    <Shot id="05" time="00:27–00:36" label="VOX FUGIENS">
      <Camera>Long lens down corridor</Camera>
      <Action>Future Mara steps out of the reflected linework, looks back once, then runs toward a remote gold horizon. She never speaks or beckons.</Action>
      <Sound>Fleeing texture moves upward and away through the stereo field.</Sound>
      <Meaning>The future creates orientation and allure, not an order.</Meaning>
    </Shot>
    <Shot id="06" time="00:36–00:45" label="THE PULL">
      <Camera>Low lateral track</Camera>
      <Action>Mara approaches. Her ruler, loose paper, and pencil slide toward the corridor. A framed photograph remains fixed, showing that not everything shares the pull.</Action>
      <Sound>Present pulse enters beneath the score; object slides are tactile and dry.</Sound>
      <Meaning>Desire has force, but other commitments retain independent weight.</Meaning>
    </Shot>
    <Shot id="07" time="00:45–00:53" label="THE THIRD VOICE">
      <Camera>Close on raised boot</Camera>
      <Action>Mara lifts one foot to run. A low stationary line sounds. The corridor beyond her first meter loses detail; the return path behind her remains sharp. She stops before landing.</Action>
      <Sound>Vox morans: one low sustained tone, not a warning chord or supernatural command.</Sound>
      <Meaning>Pause interrupts automatic pursuit and makes comparison possible.</Meaning>
    </Shot>
    <Shot id="08" time="00:53–01:03" label="MARK THE RETURN">
      <Camera>Overhead hands and floor</Camera>
      <Action>Mara takes white conservation chalk from her apron. She draws a short return line at the archive threshold, writes one small “1,” and places the chalk where it can be retrieved.</Action>
      <Sound>Chalk scrape, breath, quiet score. No heartbeat cliché.</Sound>
      <Meaning>The action is bounded, observable, and reversible.</Meaning>
    </Shot>
    <Shot id="09" time="01:03–01:12" label="ONE MARKED PACE">
      <Camera>Profile wide</Camera>
      <Action>Mara steps exactly one pace into the copper corridor. She does not chase. A single floor segment solidifies beneath her while everything farther ahead remains unresolved linework.</Action>
      <Sound>Present pulse aligns once with the fleeing texture; low held line continues.</Sound>
      <Meaning>One modest movement produces local information without proving the whole path.</Meaning>
    </Shot>
    <Shot id="10" time="01:12–01:20" label="COMPARE">
      <Camera>Mara POV, then reverse</Camera>
      <Action>Forward: the first floorboard, load limit, and next junction become visible. Backward: desk, doorway, and chalk line remain reachable. Mara records both outcomes on a small evidence tag.</Action>
      <Sound>Score thins; pencil on paper; room tone returns.</Sound>
      <Meaning>What became clearer and what remained uncertain are both preserved.</Meaning>
    </Shot>
    <Shot id="11" time="01:20–01:24" label="THE CHOICE REMAINS OPEN">
      <Camera>Medium portrait</Camera>
      <Action>Mara looks toward Future Mara, then back to the marked return line. Her expression is alert—not triumphant. The future figure waits far away without turning.</Action>
      <Sound>Three textures coexist without resolving to unison.</Sound>
      <Meaning>The pilot ends with agency, not arrival.</Meaning>
    </Shot>
    <Shot id="12" time="01:24–01:26" label="SIGNATURE">
      <Camera>Graphic lock</Camera>
      <Action>Black field: “MIRROR//LOOP CINEMA” then “CARD 001 · FUTURE-FIRST THINKING.” Small footer: “Copyright 2026, AITrailblazer.”</Action>
      <Sound>Natural two-second decay from the selected Phrase-Weave excerpt.</Sound>
      <Meaning>No sponsor, no dialogue, no explanatory moral.</Meaning>
    </Shot>

ow sustained tone, not a warning chord or supernatural command.</p><blockquote>Pause interrupts automatic pursuit and makes comparison possible.</blockquote></div></article><article class="shot"><div class="time">00:53–01:03<small>SHOT 08</small></div><div><span>MARK THE RETURN</span><h3>Overhead hands and floor</h3><p>Mara takes white conservation chalk from her apron. She draws a short return line at the archive threshold, writes one small “1,” and places the chalk where it can be retrieved.</p><p class="sound"><b>SOUND</b> Chalk scrape, breath, quiet score. No heartbeat cliché.</p><blockquote>The action is bounded, observable, and reversible.</blockquote></div></article><article class="shot"><div class="time">01:03–01:12<small>SHOT 09</small></div><div><span>ONE MARKED PACE</span><h3>Profile wide</h3><p>Mara steps exactly one pace into the copper corridor. She does not chase. A single floor segment solidifies beneath her while everything farther ahead remains unresolved linework.</p><p class="sound"><b>SOUND</b> Present pulse aligns once with the fleeing texture; low held line continues.</p><blockquote>One modest movement produces local information without proving the whole path.</blockquote></div></article><article class="shot"><div class="time">01:12–01:20<small>SHOT 10</small></div><div><span>COMPARE</span><h3>Mara POV, then reverse</h3><p>Forward: the first floorboard, load limit, and next junction become visible. Backward: desk, doorway, and chalk line remain reachable. Mara records both outcomes on a small evidence tag.</p><p class="sound"><b>SOUND</b> Score thins; pencil on paper; room tone returns.</p><blockquote>What became clearer and what remained uncertain are both preserved.</blockquote></div></article><article class="shot"><div class="time">01:20–01:24<small>SHOT 11</small></div><div><span>THE CHOICE REMAINS OPEN</span><h3>Medium portrait</h3><p>Mara looks toward Future Mara, then back to the marked return line. Her expression is alert—not triumphant. The future figure waits far away without turning.</p><p class="sound"><b>SOUND</b> Three textures coexist without resolving to unison.</p><blockquote>The pilot ends with agency, not arrival.</blockquote></div></article><article class="shot"><div class="time">01:24–01:26<small>SHOT 12</small></div><div><span>SIGNATURE</span><h3>Graphic lock</h3><p>Black field: “MIRROR//LOOP CINEMA” then “CARD 001 · FUTURE-FIRST THINKING.” Small footer: “Copyright 2026, AITrailblazer.”</p><p class="sound"><b>SOUND</b> Natural two-second decay from the selected Phrase-Weave excerpt.</p><blockquote>No sponsor, no dialogue, no explanatory moral.</blockquote></div></article></section><h2>Three voices, no exposition</h2><section class="voices"><div><b>VOX FUGIENS</b><p>Future Mara and a high, moving texture. She establishes direction but never commands.</p></div><div><b>VOX SEQUENS</b><p>Mara’s present body, footsteps, and repeatable pulse. She bears consequences.</p></div><div><b>VOX MORANS</b><p>The low held line, chalk mark, and pause that preserve reversibility.</p></div></section><h2>If the silent test fails</h2><section class="fixes"><div><b>PROPHECY MISREAD</b><p>Confine Future Mara to reflected copper, remove beckoning, reduce glow, and cut back to ordinary tools.</p></div><div><b>REVERSIBILITY UNCLEAR</b><p>Strengthen the overhead chalk insert, keep the return path in frame, and show the desk and exit reachable in reverse angle.</p></div><div><b>THIRD VOICE FEELS OMINOUS</b><p>Remove stingers and sub-drops. Use a clean held tone with gentle onset and stable level.</p></div></section><h2>Evaluation gate</h2><section class="gates"><div><b>COMPREHENSION</b><p>≥70% identify the one-step action as limited and reversible.</p></div><div><b>EVIDENCE</b><p>≥70% distinguish local clarity from proof of the complete path.</p></div><div><b>AGENCY</b><p>≤20% interpret Future Mara as authoritative prophecy.</p></div></section><section class="panel testgate"><h3>Human gate is still open</h3><p>The previsualization package is complete, but no synthetic review can satisfy the cold-viewer evidence gate. Recruit ten people who have not read this document, show only the clean animatic, record their answers verbatim, then run the randomized X/Y/Z sound comparison.</p><p><a href="../artifacts/cinema/arc01/episode001/test/EP001_Human_Test_Response_Template.csv" download>Download the 10-person response template</a></p></section><h2>Previsualization package</h2><section class="assets"><article class="panel"><h3>Silent-test animatic · 01:26</h3><video controls preload="metadata" src="../artifacts/cinema/arc01/episode001/animatic/MIRROR_LOOP_ARC01_EP001_Silent_Test_Animatic_v1.mp4"></video><p class="asset-note">Clean frames; no production labels. Variant B is attached provisionally.</p><h3>Continuity kit</h3><img src="../artifacts/cinema/arc01/episode001/continuity/EP001_Continuity_Kit.png" alt="Episode 001 continuity kit"></article><article class="panel"><h3>Blind sound test</h3><p><b>A · Source only</b></p><audio controls preload="metadata" src="../artifacts/cinema/arc01/episode001/audio/EP001_Sound_Test_A_Source_Only.m4a"></audio><p><b>B · Held tone</b></p><audio controls preload="metadata" src="../artifacts/cinema/arc01/episode001/audio/EP001_Sound_Test_B_Held_Tone.m4a"></audio><p><b>C · Pre-pause + held tone</b></p><audio controls preload="metadata" src="../artifacts/cinema/arc01/episode001/audio/EP001_Sound_Test_C_PrePause_Held_Tone.m4a"></audio><p class="asset-note">All variants: 86.0 seconds, 48 kHz stereo, −15.6 LUFS integrated, −1.5 dBFS true peak. Randomize labels during human testing.</p></article></section><h2>Series continuity</h2><section class="road"><div><b>01</b><span>Card 001</span><small>The Unplayed Note</small></div><div><b>02</b><span>Card 002</span><small>The One-Night Covenant</small></div><div><b>03</b><span>Card 003</span><small>The First Vector</small></div><div><b>04</b><span>Card 004</span><small>The First Apple</small></div><div><b>05<
