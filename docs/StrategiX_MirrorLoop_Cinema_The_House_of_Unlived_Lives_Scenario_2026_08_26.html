  <Purpose>Create an original sponsor-free twelve-episode cinematic scenario from twelve selected MIRROR//LOOP cards, independent of the Future Vision XPRIZE film.</Purpose>
  <Premise>A restoration architect enters an impossible house made from the futures she postponed. Each room turns one MIRROR//LOOP card into a physical law. She can escape only by replacing prediction and permanent identity with reflection, bounded experiments, and revisable choice.</Premise>
  <Logline>A woman trapped in a house built from her unlived lives must cross twelve card-born rooms without allowing any one future to become her prison.</Logline>
  <SeriesQuestion>Can a person choose a direction without turning that choice into a cage?</SeriesQuestion>
  <DramaticThesis>The cards do not tell the protagonist who she is or what to do. They expose one hidden structure and invite one reversible test.</DramaticThesis>
  <Characters>
    <Character id="traveler" role="protagonist">A restoration architect in her late thirties or early forties. Visually consistent across all episodes. Precise, capable, exhausted by lives she can imagine but has not chosen.</Character>
    <Character id="house" role="antagonistic-system">Not evil and never voiced. It rewards certainty, permanence, and self-definition until those virtues become confinement.</Character>
    <Character id="future-echoes" role="reflections">Possible selves, never authoritative prophecies. They reveal tradeoffs and disappear when treated as destiny.</Character>
  </Characters>
  <WorldRules>
    <Rule>The house may reveal consequences but cannot predict the true future.</Rule><Rule>Every room offers an apparently permanent answer.</Rule><Rule>Every escape requires a bounded, observable, reversible action.</Rule><Rule>The original card artwork always appears before the room manifests.</Rule><Rule>Card text and imagery govern the room; spectacle may not contradict the card.</Rule><Rule>No narrator explains a lesson the protagonist can demonstrate through action.</Rule><Rule>Each room leaves one physical motif that joins the next, creating a continuous season.</Rule>
  </WorldRules>

  <SeasonSequence>
    <Episode number="01" card="005" title="THE PULL" storyTitle="The house appears">
      <Crisis>A burned-out restoration architect receives a black-and-gold card. Its arrow lifts from the paper and becomes a golden thread leading to an impossible house that contains every life she postponed.</Crisis><ReversibleAction>She follows only far enough to learn where the pull leads, then marks a return point.</ReversibleAction><ClosingTruth>A pull is not a command.</ClosingTruth>
      <Runtime targetSeconds="86"><Beat start="0" end="3">Cold-open consequence</Beat><Beat start="3" end="9">Original card, intact and readable</Beat><Beat start="9" end="18">Glyph breaks into three dimensions</Beat><Beat start="18" end="49">Room presents the conflict</Beat><Beat start="49" end="67">Protagonist runs a reversible experiment</Beat><Beat start="67" end="78">World changes and meaning lands</Beat><Beat start="78" end="83">Viewer-facing Mirror prompt</Beat><Beat start="83" end="86">MIRROR//LOOP Cinema end signature and copyright</Beat></Runtime>
    </Episode>
    <Episode number="02" card="023" title="RESISTANCE COMPASS" storyTitle="The compass refuses north">
      <Crisis>Inside the foyer, a brass compass points toward the most costly door rather than north. Every attempt to force it makes the room rotate.</Crisis><ReversibleAction>She tests five inputs—values, evidence, constraints, safety, and consequences—until the needle becomes information instead of authority.</ReversibleAction><ClosingTruth>Resistance is one signal, not the compass.</ClosingTruth>

    </Episode>
    <Episode number="03" card="033" title="IDENTITY ANCHOR" storyTitle="The room that will not move">
      <Crisis>An anchor chains her to a perfect reconstruction of her old life. The room calls stability virtue and immobility loyalty.</Crisis><ReversibleAction>She lifts one removable link and schedules its return, proving that commitment can hold without becoming a prison.</ReversibleAction><ClosingTruth>An anchor needs a release.</ClosingTruth>
      <Runtime targetSeconds="86"><Beat start="0" end="3">Cold-open consequence</Beat><Beat start="3" end="9">Original card, intact and readable</Beat><Beat start="9" end="18">Glyph breaks into three dimensions</Beat><Beat start="18" end="49">Room presents the conflict</Beat><Beat start="49" end="67">Protagonist runs a reversible experiment</Beat><Beat start="67" end="78">World changes and meaning lands</Beat><Beat start="78" end="83">Viewer-facing Mirror prompt</Beat><Beat start="83" end="86">MIRROR//LOOP Cinema end signature and copyright</Beat></Runtime>
    </Episode>
    <Episode number="04" card="044" title="EMOTIONAL GATE" storyTitle="The door hears what plans ignore">
      <Crisis>A monumental gate rejects every key, credential, and rational plan. Behind it, the sound of her younger self asking not to be abandoned.</Crisis><ReversibleAction>She names the concern aloud. One gate leaf opens—not because fear vanished, but because it entered the negotiation.</ReversibleAction><ClosingTruth>The feeling is part of the plan.</ClosingTruth>

    </Episode>
    <Episode number="05" card="060" title="SABOTAGE ENDS" storyTitle="The hidden agreement">
      <Crisis>A clockwork room repeatedly destroys whatever she builds. At its center is a contract signed in her childhood: never outgrow the people you love.</Crisis><ReversibleAction>She preserves its care, strikes its prohibition, and seals a reviewable agreement. The machinery reverses.</ReversibleAction><ClosingTruth>Make the hidden agreement explicit.</ClosingTruth>

    <Episode number="06" card="072" title="ZERO DISTANCE" storyTitle="The future is already practicing">
      <Crisis>A corridor folds endlessly toward an older version of her who seems unreachable. The future figure performs one ordinary gesture she can do now.</Crisis><ReversibleAction>She mirrors that single behavior. The corridor collapses until both versions occupy one point.</ReversibleAction><ClosingTruth>The future begins as a present practice.</ClosingTruth>

    </Episode>
    <Episode number="07" card="079" title="FRACTURE CHOICE" storyTitle="Two houses, neither final">
      <Crisis>The house splits along a gold fault into two complete lives: one safe and shrinking, one expansive and costly. Both demand permanent selection.</Crisis><ReversibleAction>She refuses false finality and runs one reversible day inside each path. The fracture becomes a bridge.</ReversibleAction><ClosingTruth>Test the path before becoming it.</ClosingTruth>

    <Episode number="08" card="095" title="IDENTITY ARCHITECT" storyTitle="She designed the maze">
      <Crisis>Blueprints reveal that the house was assembled from her repeated cues, routines, and surrendered decisions. She is not merely trapped inside it; she helped build it.</Crisis><ReversibleAction>She moves one wall, changes one cue, and watches an entire route reconfigure.</ReversibleAction><ClosingTruth>Change the structure, then observe the self.</ClosingTruth>

    <Episode number="09" card="105" title="EXPIRED VOW" storyTitle="Burn the rule, keep the truth">
      <Crisis>A chapel room asks her to renew every promise she ever made. One vow still glows although its world is gone.</Crisis><ReversibleAction>She burns the expired wording. A single gold filament survives—the value worth carrying forward.</ReversibleAction><ClosingTruth>Release the vow; keep the truth.</ClosingTruth>

      <Crisis>Two luminous rooms offer incompatible desires. Each hides its costs behind a flawless surface and calls the other fear.</Crisis><ReversibleAction>She opens the walls, making consequences to herself and others visible, then conducts bounded trials instead of declaring purity.</ReversibleAction><ClosingTruth>No desire is evaluated alone.</ClosingTruth>

    <Episode number="12" card="142" title="IDENTITY FLOW" storyTitle="There is no final room">
      <Crisis>The key opens the last door onto another locked chamber—the promise of a finished self. She understands the house will generate rooms forever if she keeps asking it to define her.</Crisis><ReversibleAction>She melts the key. Walls become rivers of gold and teal. She leaves carrying a blank card on which no future has been prescribed.</ReversibleAction><ClosingTruth>The loop remains open because she does.</ClosingTruth>

  <SoundContract><Rule>Each episode uses only its same-number Phrase-Weave Variant II master as musical source.</Rule><Rule>Select an 86-second edit at audible phrase boundaries after human listening; do not blindly use the first 86 seconds.</Rule><Rule>Voice-over is optional and capped at 45 words; diegetic action must carry comprehension.</Rule><Rule>The house has one recurring low structural resonance; each card adds its own timbral identity.</Rule><Rule>End card music resolves without a sponsor sting.</Rule></SoundContract>
  <VisualContract><Rule>The source card is a locked plate; generative tools must not redraw its typography.</Rule><Rule>Breakout begins from the card's actual central glyph, color, and material grammar.</Rule><Rule>The house preserves a common architecture while each room inherits one card's dominant geometry.</Rule><Rule>Use one protagonist character bible and fixed wardrobe evolution across all twelve episodes.</Rule><Rule>Frame masters center-safe for 16:9, 9:16, and 1:1 derivatives.</Rule></VisualContract>
  <DistributionContract><Rule>Release one complete 75–90 second episode on YouTube and mirrorloopai.com.</Rule><Rule>Publish a 20–35 second vertical derivative that links to the complete episode.</Rule><Rule>The app unlocks the living card, full Phrase-Weave track, reflection, and reversible test corresponding to the episode.</Rule><Rule>Website video loads only after user intent to limit bandwidth cost.</Rule></DistributionContract>
  <AcceptanceCriteria><Criterion>All twelve selected cards appear exactly once and retain their source identity.</Criterion><Criterion>One continuous protagonist and one continuous house connect the season.</Criterion><Criterion>Every episode contains an observable reversible action rather than a supernatural answer.</Criterion><Criterion>A cold viewer can state the conflict and the tested choice without reading supplementary copy.</Criterion><Criterion>The final episode resolves the season while leaving the MIRROR//LOOP open.</Criterion><Criterion>No XPRIZE, sponsor, Artificial Sun, Atlantis, or competition framing appears in the new scenario.</Criterion></AcceptanceCriteria>
  <DecisionLog><Decision date="2026-08-26">Create an original scenario rather than retrofit The Artificial Sun.</Decision><Decision date="2026-08-26">Treat the twelve selections as one season, not a twelve-card montage.</Decision><Decision date="2026-08-26">Use The House of Unlived Lives as a reusable standing world that contains production cost and strengthens continuity.</Decision><Decision date="2026-08-26">Make reversibility the repeated dramatic action, not merely explanatory text.</Decision><Decision date="2026-08-26">End with a blank card rather than Card 144 so the story rejects final identity closure.</Decision></DecisionLog>
  <RisksAndOpenQuestions><Risk>Character drift across generative clips can break emotional continuity; lock a character reference set before Episode 01.</Risk><Risk>The house can look like generic fantasy; its material bible must derive from the cards' black, teal, antique-gold, glass, and enamel language.</Risk><Risk>Too much spoken explanation will turn the series into a lecture; run silent-first comprehension checks.</Risk><OpenQuestion>Episode 01 human cold-viewer testing will determine whether the house premise reads within 18 seconds.</OpenQuestion></RisksAndOpenQuestions>

<article class="episode"><div class="ep">12</div><div><span>Card 142</span><h3>Identity Flow</h3><h4>There is no final room</h4><p>The key opens the last door onto another locked chamber—the promise of a finished self. She understands the house will generate rooms forever if she keeps asking it to define her.</p><p class="action"><b>Reversible action:</b> She melts the key. Walls become rivers of gold and teal. She leaves carrying a blank card on which no future has been prescribed.</p><blockquote>The loop remains open because she does.</blockquote></div></article></section><h2>Every episode · 86 seconds</h2><section class="timeline"><div class="beat"><b>0–3</b>consequence</div><div class="beat"><b>3–9</b>original card</div><div class="beat"><b>9–18</b>3D breakout</div><div class="beat"><b>18–49</b>conflict</div><div class="beat"><b>49–67</b>reversible test</div><div class="beat"><b>67–78</b>visible change</div><div class="beat"><b>78–83</b>viewer question</div><div class="beat"><b>83–86</b>series mark</div></section><section class="panel" style="margin-top:22px"><h3>Embedded XML contract</h3><pre>${contract}</pre></section><footer><span>MIRROR//LOOP Cinema · The House of Unlived Lives</span><span>Copyright 2026, AITrailblazer</span></footer></main>`}}customElements.define('scenario-app',ScenarioApp);</script></body></html>
