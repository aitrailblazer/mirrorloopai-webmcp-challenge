  <script id="mirrorloop-cinema-strategy-xml" type="application/xml">
<MirrorLoopCinemaGrowthStrategy version="1.1" date="2026-08-26" status="recommended-cost-bounded" canonicalFormat="html">
  <CanonicalArtifact>
    <Path>mirrorloopai-web/docs/StrategiX_MirrorLoop_Cinema_Growth_Strategy_2026_08_26.html</Path>
    <Owner>AITrailblazer</Owner>
    <Brand>MIRROR//LOOP</Brand>
    <Domain>https://mirrorloopai.com</Domain>
    <Purpose>Convert the existing film, 144-card system, Phrase-Weave music, website, and iOS/macOS application into one durable discovery, reflection, and retention system whose media and automation costs do not grow in direct proportion to audience traffic.</Purpose>
  </CanonicalArtifact>

  <EvidenceBoundary>
    <Fact status="SUPPORTED">The live website is a privacy-conscious twelve-question reflection with optional email capture.</Fact>
    <Fact status="SUPPORTED">The website currently has no Cinema page, app-download call to action, film player, or public card library beyond Card 012.</Fact>
    <Fact status="SUPPORTED">The Apple app contains quiz, result, library, companion, commerce, social-post, and Phrase-Weave audio surfaces, but no native video player or Cinema destination.</Fact>
    <Fact status="SUPPORTED">The film repository contains a 195-second 1920-by-1080 H.264/AAC master, embedded subtitles, a separate SRT, and six vertical campaign cuts.</Fact>
    <Fact status="SUPPORTED">The Phrase-Weave directory contains Card 000 through Card 144, yielding 145 audio files. This strategy treats Card 000 as the prologue and Cards 001 through 144 as the public 144-card library.</Fact>
    <Judgment status="SUPPORTED_WITH_QUALIFICATION">The existing film is suitable as a manifesto and world-building asset but is not the strongest homepage explainer or repeatable content format. This is an expert design judgment, not measured audience evidence.</Judgment>
  </EvidenceBoundary>

  <StrategicThesis>
    <Primary>Do not discard The Artificial Sun and do not make it carry the whole product. Preserve it as MIRROR//LOOP Cinema Chapter 00, derive cleaner brand cuts from it, and use the cards as the repeatable media engine.</Primary>
    <Positioning>MIRROR//LOOP is a reflective media system in which every card can be seen, heard, entered as a short cinematic world, and applied as a prompt for action.</Positioning>
    <OwnedCenter>mirrorloopai.com is the canonical bridge between discovery channels and the Apple application.</OwnedCenter>
    <NorthStar>Increase completed reflection loops: watch or discover, reflect, reveal a card, hear its music, take one action, and return.</NorthStar>
    <CostInvariant>Viral traffic must be carried primarily by YouTube, social platforms, Apple distribution, browser rendering, and on-device rendering—not by metered MIRROR//LOOP video delivery, per-view AI generation, per-view database writes, or per-view email.</CostInvariant>
  </StrategicThesis>

  <FilmPortfolio>
    <Asset id="manifesto-archive" duration="195s" role="provenance">
      <Name>The Artificial Sun — Original Competition Master</Name>
      <Action>Preserve unchanged and retain privately or as an archival link. Do not use it as the primary public edition.</Action>
    </Asset>
    <Asset id="brand-master" duration="180s" role="flagship">
      <Name>MIRROR//LOOP Cinema Chapter 00 — The Artificial Sun</Name>
      <Action>Remove the sponsor ending and competition framing, retain captions, add an AITrailblazer copyright line and a mirrorloopai.com end card.</Action>
    </Asset>
    <Asset id="discovery-cut" duration="75-90s" role="conversion">
      <Name>The Artificial Sun — Start Here</Name>
      <Action>Re-edit around one causal spine: prediction becomes prescription, authority is separated, the person remains free.</Action>
    </Asset>
    <Asset id="hero-loop" duration="12-20s" role="website">
      <Name>Homepage Silent Teaser</Name>
      <Action>Use muted autoplay only when motion preference permits, burned-in words, a poster fallback, and no third-party player on initial load.</Action>
    </Asset>
    <Asset id="shorts" duration="15-40s" role="discovery">
      <Name>Six Vertical Signals</Name>
      <Action>Reframe each existing vertical cut with an immediate question, readable captions, one idea, one card, and one mirrorloopai.com destination.</Action>
    </Asset>
    <Asset id="card-films" duration="10-18s" role="scale">
      <Name>144 Card Films</Name>
      <Action>Build the repeatable future format: original card, dimensional transformation, human consequence, reflection phrase, and return to the card.</Action>
    </Asset>
  </FilmPortfolio>

  <CardFilmGrammar>
    <Beat index="1" duration="2-3s">Show the original card in full, with its exact number, title, and phrase legible.</Beat>
    <Beat index="2" duration="2-4s">Let the engraved geometry separate into depth, light, architecture, and material motion without replacing the card identity.</Beat>
    <Beat index="3" duration="4-7s">Turn the card principle into one observable human choice or environmental consequence.</Beat>
    <Beat index="4" duration="2-3s">Keep or restore the core phrase over the scene so meaning survives without audio.</Beat>
    <Beat index="5" duration="1-2s">Resolve to the card and mirrorloopai.com/card/{number}, with the Phrase-Weave motif continuing across the cut.</Beat>
    <Constraint>Do not depend on recurring synthetic actors across unrelated generations. Prefer hands, silhouettes, architecture, objects, ritualized actions, and controlled close-ups when continuity cannot be guaranteed.</Constraint>
    <Constraint>Every film must work muted, include captions when speech exists, preserve the original card, and avoid invented text inside generated imagery.</Constraint>
  </CardFilmGrammar>

  <WebsiteContract>
    <Route path="/">Lead with the reflection and a restrained motion teaser; keep the existing privacy-first promise.</Route>
    <Route path="/cinema">Index manifesto films, card films, and curated thematic playlists.</Route>
    <Route path="/cinema/artificial-sun">Host the brand master, transcript, core idea, linked cards, and reflection call to action.</Route>
    <Route path="/cards">Expose the twelve arcs and the public 144-card index.</Route>
    <Route path="/card/{number}">Provide one canonical share destination with card art, exact phrase, short film, music preview, reflection prompt, and app deep link.</Route>
    <Route path="/listen">Offer Phrase-Weave previews and explain how sound relates to the cards.</Route>
    <Route path="/app">Explain the iOS/macOS experience and route to TestFlight or App Store when a verified destination exists.</Route>
    <Rule>Do not require email before the visitor receives the quiz result or sees the featured card.</Rule>
    <Rule>Do not make third-party video embeds part of the initial homepage render. Load a youtube-nocookie.com embed only after an explicit Watch action.</Rule>
    <Rule>Use static HTML, CSS, compressed card images, immutable caching, and client-side scoring for ordinary traffic.</Rule>
    <Rule>Do not call Cloud Run or Firestore for page views, video progress, card views, or quiz answers.</Rule>
  </WebsiteContract>

  <AppContract>
    <Destination>Introduce a Cinema destination alongside Portal, Quiz, Library, and Companion.</Destination>
    <Playback costMode="zero-marginal-first">Bundle only a compact flagship discovery cut if app size permits; play the complete public film through a user-initiated YouTube embed or external YouTube handoff. Do not operate a metered streaming origin for the first release.</Playback>
    <LivingCards>Render the scalable 144-card cinematic experience locally with existing SwiftUI, Canvas, Metal shaders, and bundled Phrase-Weave audio instead of downloading 144 pre-rendered movies.</LivingCards>
    <Export>Use the existing deterministic AVAssetWriter architecture to create 15-second social MP4s on the user's device. Sharing uploads directly from the device to the selected social platform; no MIRROR//LOOP render or media server is involved.</Export>
    <Manifest>
      <Field>filmID</Field>
      <Field>title</Field>
      <Field>edition</Field>
      <Field>duration</Field>
      <Field>youtubeVideoID</Field>
      <Field>bundledResource optional="true">Compact offline edition only</Field>
      <Field>posterURL</Field>
      <Field>captionURL</Field>
      <Field>transcriptURL</Field>
      <Field>cardIDs</Field>
      <Field>arcID</Field>
      <Field>phraseWeaveTrackIDs</Field>
      <Field>copyright</Field>
      <Field>availability</Field>
    </Manifest>
    <DeepLink>mirrorloop://cinema/artificial-sun?scene={sceneID}&amp;card={cardID}</DeepLink>
    <Progress>Store local playback position and completion state; sync only when the existing user-consent and CloudKit boundary permits it.</Progress>
    <Rule>Do not use private YouTube. Use Public videos for discovery and Unlisted videos only for bounded previews.</Rule>
    <Rule>Never proxy YouTube media through MIRROR//LOOP infrastructure or download YouTube media for offline reuse.</Rule>
  </AppContract>

  <DistributionContract>
    <YouTube>
      <Role>Public discovery, search, playlists, comments, long-form viewing, and platform-funded delivery of high-bandwidth public video.</Role>
      <Visibility>Use Public for intended audience growth. Use Unlisted only for controlled previews, press, and testing.</Visibility>
      <Playlists>Start Here; MIRROR//LOOP Cinema; The 12 Arcs; 144 Card Films; The Artificial Sun.</Playlists>
      <Destination>Every description, pinned comment, channel link, and end screen routes to the matching mirrorloopai.com page. Website and app players request the YouTube asset only after the user chooses Watch.</Destination>
    </YouTube>
    <ShortForm>
      <Channels>YouTube Shorts, Instagram Reels, and selected X video posts.</Channels>
      <Rule>Each post carries one question, one card, one principle, one destination, and burned-in captions.</Rule>
      <Rule>Publish coherent series rather than flooding all 144 cards. Organize releases by one arc at a time.</Rule>
    </ShortForm>
    <Email>
      <Role>Deliver the promised reflection, then offer a low-frequency Card of the Week or Cinema chapter.</Role>
      <Rule>Preserve double opt-in and never imply diagnostic authority.</Rule>
    </Email>
  </DistributionContract>

  <MediaDelivery costMode="zero-marginal-first">
    <Decision>Use YouTube as the primary public video-delivery network, the App Store as the application-distribution network, and local device rendering as the 144-card motion engine.</Decision>
    <Website>Serve only a compressed local poster before consent. On Watch, load the privacy-enhanced YouTube embed. Do not self-host the 195-second master, vertical films, or 144 card films on Firebase Hosting.</Website>
    <Application>Use an approved user-initiated YouTube web player or external handoff for the full public film. Optionally bundle one aggressively compressed discovery cut for an offline first-run experience after measuring app-size impact.</Application>
    <LivingCards>Use local Metal/SwiftUI motion plus bundled card art and Phrase-Weave audio. This makes one renderer support 144 cards without 144 video downloads.</LivingCards>
    <Publishing>Generate deterministic 9:16, 4:5, and 1:1 MP4 artifacts on the Mac or user's Apple device and upload each final artifact once to YouTube or the chosen social network.</Publishing>
    <PaidUpgradeGate>Do not add Mux, Cloudflare Stream, a video CDN, or object-storage egress until a measured product requirement cannot be met by YouTube, bundled media, or local rendering and a revenue source covers the estimated peak bill.</PaidUpgradeGate>
  </MediaDelivery>

  <CostGuardrails>
    <Guardrail id="CG-01">No per-view AI inference. All public copy, card matching, and animation parameters are precomputed or executed locally.</Guardrail>
    <Guardrail id="CG-02">No per-view backend analytics. Use YouTube Studio for video metrics and sampled or disabled first-party events for website experiments.</Guardrail>
    <Guardrail id="CG-03">Cloud Run remains minimum instances zero and maximum instances one. It serves explicit subscription operations only.</Guardrail>
    <Guardrail id="CG-04">Add an application-level daily ceiling for subscriber writes and confirmation emails. On exhaustion, fail closed with a static follow-on-YouTube or App Store action.</Guardrail>
    <Guardrail id="CG-05">Treat the existing cloud budget as an alert, not a spending cap. Add service quotas, daily counters, and a manual global disable switch.</Guardrail>
    <Guardrail id="CG-06">Keep the public site static and small. If static transfer approaches the current Firebase allowance, migrate or front the static surface with a verified flat-cost or no-egress-cost static host before the billable threshold.</Guardrail>
    <Guardrail id="CG-07">Do not host full-resolution audio previews on the website. Use short bounded previews only where essential; the complete Phrase-Weave library remains bundled in the app.</Guardrail>
    <Guardrail id="CG-08">Do not build all 144 cinematic exports before one twelve-card season proves demand.</Guardrail>
    <Guardrail id="CG-09">Every optional paid service begins disabled and requires an explicit cost-envelope decision before activation.</Guardrail>
  </CostGuardrails>

  <MeasurementContract>
    <NorthStar>completed_reflection_loop</NorthStar>
    <Event source="youtube-studio">video impressions, starts, completion, retention, and subscribers</Event>
    <Event source="client-local">quiz started, quiz completed, card revealed, and music preview started</Event>
    <Event source="server-sampled-or-disabled">quiz_started_from_cinema, quiz_completed_from_cinema, and app_cta_clicked</Event>
    <Event source="subscriber-backend">subscription requested and subscription confirmed only</Event>
    <Privacy>Keep first-party experiment events aggregate, sampled, and kill-switch controlled. Do not add cross-site trackers, device fingerprinting, or answer-level analytics.</Privacy>
    <ExperimentGate>Before scaling production, compare the 75-to-90-second discovery cut against the current 195-second film using completion, quiz-start, and quiz-completion rates.</ExperimentGate>
  </MeasurementContract>

  <Roadmap>
    <Phase id="foundation" horizon="1-2 weeks">
      <Action>Create the sponsor-free brand master, discovery cut, silent teaser, canonical poster, captions, transcript, and hashes.</Action>
      <Action>Add /cinema/artificial-sun and connect it to the existing quiz.</Action>
      <Action>Configure a private Git remote for mirrorloopai-web before further production changes.</Action>
      <Action>Upload public video once to YouTube and serve only the poster plus click-to-load privacy-enhanced embed from the website.</Action>
    </Phase>
    <Phase id="bridge" horizon="2-4 weeks">
      <Action>Add /cards, the first twelve card pages, one arc page, music previews, and campaign-specific URLs.</Action>
      <Action>Reissue the six vertical films with unified branding, copyright, captions, and domain calls to action.</Action>
    </Phase>
    <Phase id="app-cinema" horizon="4-6 weeks">
      <Action>Add the Cinema destination, user-initiated YouTube playback, optional bundled discovery cut, deep links, and film-to-card transitions to iOS and macOS.</Action>
      <Action>Connect quiz results to the matching card, music, and Cinema moment.</Action>
      <Action>Implement local Living Card motion and deterministic social export so card-scale growth creates no server rendering or delivery bill.</Action>
    </Phase>
    <Phase id="repeatable-series" horizon="ongoing">
      <Action>Produce one twelve-card arc as a measured season before committing to all 144 card films.</Action>
      <Action>Scale only formats that move viewers into completed reflection loops and repeat app sessions.</Action>
    </Phase>
  </Roadmap>

  <AcceptanceCriteria>
    <Requirement>The original competition master remains preserved and unmodified.</Requirement>
    <Requirement>The public brand edition contains no sponsor or competition dependency.</Requirement>
    <Requirement>Every public film is captioned and understandable when muted.</Requirement>
    <Requirement>Every video destination resolves through mirrorloopai.com and has an explicit next action.</Requirement>
    <Requirement>Every card film begins and ends with the authentic card identity.</Requirement>
    <Requirement>The website remains usable without third-party scripts or video loading on first paint.</Requirement>
    <Requirement>The app plays the optional bundled edition locally and permits the public YouTube edition without requiring a signed-in Google account.</Requirement>
    <Requirement>Ordinary public traffic creates no per-view Cloud Run request, Firestore write, email, AI inference, or MIRROR//LOOP video-egress charge.</Requirement>
    <Requirement>A sudden traffic spike can exhaust a bounded signup allowance without creating unbounded backend or email spend.</Requirement>
    <Requirement>All media displays Copyright 2026, AITrailblazer in a legible but non-disruptive location.</Requirement>
    <Requirement>Analytics remain aggregate and consistent with the current privacy promise.</Requirement>
  </AcceptanceCriteria>

  <DecisionLog>
    <Decision date="2026-08-26">Retire XPRIZE as the public organizing frame; preserve it only as provenance.</Decision>
    <Decision date="2026-08-26">Keep The Artificial Sun as Chapter 00 and derive a sponsor-free MIRROR//LOOP brand edition.</Decision>
    <Decision date="2026-08-26">Use cards, not recurring synthetic actors, as the primary continuity system for future cinematic production.</Decision>
    <Decision date="2026-08-26">Make mirrorloopai.com the canonical conversion and deep-link hub.</Decision>
    <Decision date="2026-08-26">Use YouTube for public video delivery, optional bundled playback for one compact app edition, and local rendering for Living Cards.</Decision>
    <Decision date="2026-08-26">Reject a dedicated HLS/video-CDN bill for the first release.</Decision>
    <Decision date="2026-08-26">Treat the Apple application as the zero-marginal-cost card-film renderer and social export factory.</Decision>
    <Decision date="2026-08-26">Treat Card 000 as a prologue so Cards 001 through 144 remain the public 144-card library.</Decision>
  </DecisionLog>

  <RisksAndOpenQuestions>
    <Risk>Character and costume discontinuity in generative footage can weaken a conventional dramatic narrative.</Risk>
    <Risk>The existing dialogue contains production-like or overly literal lines that should not define the new brand voice.</Risk>
    <Risk>Producing 144 films before validating one twelve-card season would consume resources without proving retention.</Risk>
    <Risk>Embedding third-party players can conflict with the website's current privacy and content-security posture; load YouTube only after consent and narrowly update CSP.</Risk>
    <Risk>The app repository currently contains extensive uncommitted work; Cinema implementation requires an isolated branch and clean integration plan.</Risk>
    <OpenQuestion>A verified App Store or TestFlight destination is not yet present in the inspected website or app sources.</OpenQuestion>
    <Risk>YouTube controls player behavior, availability, policy, and recommendation context; retain local archival masters and export provenance.</Risk>
    <Risk>The existing $10 cloud budget alerts but does not automatically stop spend.</Risk>
    <OpenQuestion>The exact subscriber and email daily ceilings require the current provider allowance and acceptable missed-signup policy.</OpenQuestion>
  </RisksAndOpenQuestions>

  <ImplementationNotes>
    <Note>Keep media binaries out of the static hosting repository unless they are small posters or deliberately bounded previews.</Note>
    <Note>Generate a machine-readable film manifest from the fields in AppContract and share it between web and Apple clients.</Note>
    <Note>Update the current Firebase CSP only for youtube-nocookie.com and the minimum required YouTube player connections; do not broadly allow arbitrary frames, scripts, or connections.</Note>
    <Note>Remove ordinary funnel-event writes from the request path before exposing the film to viral traffic; retain local counters or bounded sampling.</Note>
    <Note>Preserve SRT and create WebVTT derivatives rather than burning all captions into the only master.</Note>
    <Note>Use separate public, archival, and app-delivery editions with immutable hashes and clear provenance.</Note>
  </ImplementationNotes>

        }
      `;

      render() {
        return html`
          <main>
            <header>
              <div class="eyebrow">MIRROR//LOOP · Cost-bounded growth strategy · 26 August 2026</div>
              <h1>The film is an asset.<br>The cards are the engine.</h1>
              <p class="thesis">The Artificial Sun should survive as a manifesto and an entry into the world—not as the entire explanation of the product. MIRROR//LOOP grows when every film leads to reflection, every reflection reveals a card, every card can be heard, and every path continues in the app.</p>
              <div class="decision">Cost invariant: viral traffic must be carried by YouTube, social platforms, Apple distribution, and on-device rendering—not by metered MIRROR//LOOP video delivery, AI generation, database writes, or email sends.</div>
            </header>

            <section>
              <div class="eyebrow">Film verdict</div>
              <h2>Appropriate—if assigned the right job</h2>
              <p>The film communicates the philosophical territory and gives MIRROR//LOOP a cinematic scale that a quiz alone cannot create. Its density, changing synthetic characters, and institutional vocabulary make it weaker as a cold homepage explanation. These ratings are a design assessment from inspected assets, not audience-test results.</p>
              <table>
                <thead><tr><th>Dimension</th><th>Fit / 10</th><th>Finding</th></tr></thead>
                <tbody>
                  ${scorecard.map(([name, score, finding]) => html`
                    <tr>
                      <td>${name}</td>
                      <td><b>${score}</b><div class="meter"><i style=${`width:${score * 10}%`}></i></div></td>
                      <td>${finding}</td>
                    </tr>
                  `)}
                </tbody>
              </table>
              <p class="note">The scorecard is a provisional expert heuristic. Release decisions should be governed by real completion and conversion data.</p>
            </section>

            <section>
              <div class="eyebrow">System design</div>
              <h2>One owned loop, not four disconnected channels</h2>
              <div class="flow">
                ${stages.map(([label, mechanism, payoff]) => html`
                  <article class="stage"><small>${label}</small><strong>${mechanism}</strong><span>${payoff}</span></article>
                `)}
              </div>
            </section>

            <section>
              <div class="eyebrow">Zero-marginal media architecture</div>
              <h2>One upload, millions of views, no MIRROR//LOOP video bill</h2>
              <div class="grid">
                <article class="card priority">
                  <span class="tag">Public video</span>
                  <h3>YouTube carries the bytes</h3>
                  <p>Upload each final film once. The website shows a small local poster, then loads a privacy-enhanced YouTube player only after the visitor presses Watch. Do not place the 195-second master on Firebase Hosting.</p>
                </article>
                <article class="card priority">
                  <span class="tag">144 living cards</span>
                  <h3>The device creates the motion</h3>
                  <p>Use the app’s existing SwiftUI, Canvas, Metal shaders, card art, and bundled Phrase-Weave audio. The same renderer produces 144 experiences without storing or streaming 144 videos.</p>
                </article>
                <article class="card priority">
                  <span class="tag">Social export</span>
                  <h3>The user’s device renders the MP4</h3>
                  <p>Use the existing AVAssetWriter design to generate a 15-second Reel locally. The system share sheet uploads directly to the destination; MIRROR//LOOP pays neither rendering nor delivery costs.</p>
                </article>
                <article class="card">
                  <span class="tag">Website</span>
                  <h3>Static by default</h3>
                  <p>HTML, CSS, compressed WebP posters, client-side quiz scoring, immutable caching, and no backend request for ordinary views. Keep full audio and video off the static origin.</p>
                </article>
                <article class="card">
                  <span class="tag">Backend</span>
                  <h3>Explicit actions only</h3>
                  <p>Cloud Run remains scale-to-zero and handles subscription operations—not page views. Remove or sample funnel writes and impose hard daily ceilings on database writes and confirmation emails.</p>
                </article>
                <article class="card">
                  <span class="tag">App</span>
                  <h3>Bundle only what earns its weight</h3>
                  <p>Optionally bundle one compressed discovery cut. Play the complete public film through YouTube. Keep the full Phrase-Weave collection local, where listening creates no streaming bill.</p>
                </article>
              </div>
            </section>

            <section>
              <div class="eyebrow">Media portfolio</div>
              <h2>Give each edit one purpose</h2>
              <div class="grid">
                ${filmEditions.map(([name, duration, purpose]) => html`
                  <article class="card"><span class="tag">${duration}</span><h3>${name}</h3><p>${purpose}</p></article>
                `)}
              </div>
            </section>

            <section>
              <div class="eyebrow">The scalable creative format</div>
              <h2>Card → world → choice → reflection → card</h2>
              <div class="split">
                <article class="card priority">
                  <h3>What to preserve</h3>
                  <ol>
                    <li>The original card appears fully framed and legible.</li>
                    <li>Its geometry becomes dimensional architecture or material action.</li>
                    <li>One human decision demonstrates the meaning.</li>
                    <li>The exact phrase remains visible long enough to read.</li>
                    <li>The image resolves back to the card and its canonical URL.</li>
                  </ol>
                </article>
                <article class="card">
                  <h3>What experience taught us to stop doing</h3>
                  <ul>
                    <li>Do not ask independently generated actors to carry continuity across a whole narrative.</li>
                    <li>Do not explain five governance mechanisms in one short discovery edit.</li>
                    <li>Do not let generated interface text carry essential meaning.</li>
                    <li>Do not create all 144 films before one twelve-card season proves its value.</li>
                    <li>Do not send audiences from social platforms to another platform when an owned domain exists.</li>
                  </ul>
                </article>
              </div>
            </section>

            <section>
              <div class="eyebrow">Channel roles</div>
              <h2>Website owns the relationship; YouTube earns discovery; the app earns return</h2>
              <div class="grid">
                <article class="card">
                  <h3>mirrorloopai.com</h3>
                  <p>Add <code>/cinema</code>, <code>/cinema/artificial-sun</code>, <code>/cards</code>, <code>/card/{number}</code>, <code>/listen</code>, and <code>/app</code>. Every campaign link should resolve to the corresponding owned page.</p>
                </article>
                <article class="card">
                  <h3>YouTube</h3>
                  <p>Publish the sponsor-free long film, the 75–90 second discovery edit, and organized card-film playlists. Every end screen, description, and pinned comment returns to the matching domain page.</p>
                </article>
                <article class="card">
                  <h3>iOS and macOS</h3>
                  <p>Add a Cinema destination with an optional bundled discovery cut and user-initiated public YouTube playback. Render Living Cards and social clips locally instead of paying to stream 144 movie files.</p>
                </article>
              </div>
            </section>

            <section>
              <div class="eyebrow">Release order</div>
              <h2>Build the smallest complete loop first</h2>
              <div class="grid">
                <article class="card priority"><span class="tag">1 · Foundation</span><h3>Rebrand the film</h3><p>Archive the original. Produce the 180-second brand master, 75–90 second discovery cut, 12–20 second silent teaser, captions, transcript, poster, copyright, and immutable hashes.</p></article>
                <article class="card priority"><span class="tag">2 · Website</span><h3>Launch one Cinema page</h3><p>Publish The Artificial Sun page and connect it directly to the existing reflection. Measure film start, completion, quiz start, and quiz completion.</p></article>
                <article class="card priority"><span class="tag">3 · Product bridge</span><h3>Expose the first arc</h3><p>Launch twelve canonical card pages with card art, exact phrase, short film, Phrase-Weave preview, action prompt, and app deep link.</p></article>
                <article class="card"><span class="tag">4 · App</span><h3>Add cost-free Cinema</h3><p>Bundle one compact cut if justified, hand public long-form playback to YouTube, and use a shared manifest only after the deep-link scheme and App Store destination are settled.</p></article>
                <article class="card"><span class="tag">5 · Distribution</span><h3>Release one measured season</h3><p>Publish one coherent twelve-card arc across Shorts and Reels. Drive every clip to its canonical card page rather than directly to YouTube.</p></article>
                <article class="card"><span class="tag">6 · Scale</span><h3>Earn the 144</h3><p>Expand only after a twelve-card season demonstrates completion, reflection, card exploration, audio engagement, and app return.</p></article>
              </div>
            </section>

            <section>
              <div class="eyebrow">Success model</div>
              <h2>Measure without turning every viewer into a billable write</h2>
              <div class="split">
                <article class="card">
                  <h3>Use platform and local evidence first</h3>
                  <p>YouTube Studio measures reach and retention. The browser can maintain local journey state. Send only sampled experiment events—or no custom events—while retaining explicit subscription confirmations.</p>
                </article>
                <article class="card">
                  <h3>Hard—not cosmetic—cost controls</h3>
                  <p>Budget alerts are not spending caps. Keep Cloud Run at zero-to-one instances, cap signup and email operations per day, provide a global disable switch, and fail to a static YouTube/App Store CTA instead of continuing to spend.</p>
                </article>
              </div>
            </section>

            <section>
              <div class="eyebrow">Machine-readable contract</div>
              <h2>Embedded implementation source</h2>
              <pre>${contract}</pre>
            </section>
          </main>
        `;
      }
    }

    customElements.define('mirrorloop-strategy', MirrorLoopStrategy);
  </script>
