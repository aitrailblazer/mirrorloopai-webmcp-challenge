<StrategiXVisualSpec version="1.0" status="canonical" date="2026-08-27" canonicalFormat="html">
  <CanonicalArtifact>
    <Title>MIRROR//LOOP Stripe Account Operations</Title>

    <Audience>Owner, implementation agent, security reviewer</Audience>

  <Purpose>Centralize Stripe account operations, secure checkout, paid-order notifications, and read-only audit tooling in the private mirrorloopai-web repository without committing credentials or customer data.</Purpose>
  <SystemContract>
    <Boundary name="VersionControl">Contains scripts, templates, secret names, sanitized fixtures, and this contract only.</Boundary>
    <Boundary name="LocalPrivateInventory">private/stripe/account.local.json contains secret-free account metadata and is ignored by Git.</Boundary>
    <Boundary name="SecretCustody">GCP Secret Manager stores Stripe credentials, the Resend send-only key, a separate Resend inbound full-access key, webhook signing secrets, and the audit hash salt.</Boundary>
    <Boundary name="Stripe">Stripe remains the authority for account identity, keys, products, prices, webhooks, balances, and payments.</Boundary>
    <Rule>Never commit sk_*, rk_*, whsec_*, customer PII, card data, bank data, raw Stripe exports, or webhook payloads.</Rule>
    <Rule>The audit collector performs read-only GET requests and emits sanitized deterministic identifiers.</Rule>
    <Rule>The public website receives no Stripe key or Stripe Price ID. It sends allowlisted SKUs to the Go backend, which creates a hosted Checkout Session from server-owned Price IDs.</Rule>
    <Rule>Public product cards disclose no prices. Stripe Checkout displays line-item prices and the final total before payment.</Rule>
    <Rule>Only a signature-verified paid Checkout event may trigger order email. The buyer receives a pending-fulfillment acknowledgement and the owner receives a fulfillment notification.</Rule>
    <Rule>Resend receives every local part at mirrorloopai.com and forwards only signature-verified email.received events to the owner inbox; the original sender becomes Reply-To.</Rule>
  </SystemContract>
  <DataContract>
    <Tracked>Account inventory template, secret names, scripts, sanitized fixture, source hashes, decisions, acceptance criteria.</Tracked>
    <Ignored>Local secret-free account inventory and generated sanitized audit reports.</Ignored>
    <SecretManager>mirrorloop-stripe-checkout-key; mirrorloop-stripe-webhook-secret; mirrorloop-stripe-audit-readonly-key; mirrorloop-stripe-audit-hash-salt; mirrorloop-resend-api-key; mirrorloop-resend-webhook-secret; mirrorloop-resend-inbound-api-key.</SecretManager>
  </DataContract>
  <Workflow>
    <Step order="1">Run npm run stripe:account-import to refresh the ignored account inventory from Stripe CLI configuration.</Step>
    <Step order="2">Create a fresh restricted read-only Stripe key because the discovered CLI credentials are expired.</Step>
    <Step order="3">Run deploy/bootstrap-stripe-secrets.sh to store the key and a generated salt in GCP Secret Manager.</Step>
    <Step order="4">Run npm run stripe:audit:collect to produce a sanitized local evidence packet.</Step>
    <Step order="5">Run npm run stripe:audit:analyze to verify the analysis path against sanitized data.</Step>
    <Step order="6">Grant the temporary operator key Products Write, Prices Write, and Webhook Endpoints Write; run npm run stripe:shop:provision and npm run stripe:webhook:provision.</Step>
    <Step order="7">Store a least-privilege checkout restricted key with Checkout Sessions Write plus Products and Prices Read using deploy/bootstrap-stripe-checkout-secret.sh.</Step>
    <Step order="8">Deploy Cloud Run, perform a test Checkout Session, verify both emails, then set shopEnabled true and deploy Hosting.</Step>
  </Workflow>
  <Diagram title="Credential and evidence boundary">
    <Node id="stripe" owner="Stripe">Account and restricted key</Node>
    <Node id="gcp" owner="Google Cloud">Secret Manager</Node>
    <Node id="collector" owner="Private repo">Read-only collector</Node>

    <Edge from="stripe" to="gcp">Fresh restricted key, entered locally</Edge>
    <Edge from="gcp" to="collector">Runtime secret access</Edge>
    <Edge from="collector" to="sanitized">No raw IDs, secrets, or PII</Edge>
    <Edge from="sanitized" to="analysis">Safe aggregate evidence</Edge>
  </Diagram>
  <DecisionLog>
    <Decision date="2026-08-27">Moved the Stripe audit package from aitrailblazerGENI into mirrorloopai-web because the account belongs with the private product operations repository.</Decision>
    <Decision date="2026-08-27">Replaced Azure Key Vault lookup with GCP Secret Manager to match mirrorloopai.com hosting.</Decision>
    <Decision date="2026-08-27">Restricted the subscriber Cloud Run identity to its four named secrets instead of project-wide secret access, preventing it from reading operator-only Stripe secrets.</Decision>
    <Decision date="2026-08-27">Did not copy discovered Stripe CLI keys because their expiry date had passed and credentials never belong in Git.</Decision>
    <Decision date="2026-08-27" status="superseded">Initially kept payment checkout outside the account-custody migration.</Decision>
    <Decision date="2026-08-28">Reauthorized Stripe CLI, completed a relationship-aware live MIRROR//LOOP inventory, and retained only anonymized payment evidence in ignored local artifacts.</Decision>
    <Decision date="2026-08-28">Implemented a hosted Stripe cart for 24 ARC editions and four complete editions; public catalog data omits prices and Stripe identifiers.</Decision>
    <Decision date="2026-08-28">Implemented signature-verified paid-order webhooks with replay protection, Resend idempotency keys, buyer pending-fulfillment acknowledgement, and owner fulfillment notification.</Decision>
    <Decision date="2026-08-28">Activated Resend catch-all receiving for mirrorloopai.com, separated the full-access inbound retrieval key from the send-only application key, and forwarded signed inbound events to constantine@aitrailblazer.com.</Decision>
    <Decision date="2026-08-28">Completed a catalog-backed Stripe Sandbox purchase for ARC 12 Full-Color: Checkout reported complete and paid, the signed webhook returned 200, Firestore recorded emails_sent, and Resend reported both buyer and owner messages delivered.</Decision>
  </DecisionLog>
  <AcceptanceCriteria>
    <Criterion>No Stripe credential-shaped value exists in tracked mirrorloopai-web files.</Criterion>
    <Criterion>The account importer writes a chmod 0600 ignored file and never writes API or publishable keys.</Criterion>
    <Criterion>The audit collector can resolve its two operator secrets from GCP Secret Manager.</Criterion>
    <Criterion>The fixture analyzer writes valid JSON without calling Stripe.</Criterion>
    <Criterion>The source repository no longer owns the migrated audit implementation.</Criterion>
    <Criterion>The public catalog exposes no amount, display price, Stripe Price ID, or secret.</Criterion>
    <Criterion>A paid Checkout event sends exactly one buyer acknowledgement and one owner notification under normal Stripe retries.</Criterion>
    <Criterion>Mail addressed to reflection@mirrorloopai.com or any other mirrorloopai.com local part is forwarded to the owner inbox after Resend signature verification.</Criterion>
  </AcceptanceCriteria>
  <RisksAndOpenQuestions>
    <Risk severity="medium">The reauthorized Stripe CLI credential expires on 2026-11-26 and must be renewed for later audits.</Risk>
    <Risk severity="medium">The reusable GCP restricted audit key is not yet provisioned; current live audit access depends on the local Stripe CLI session.</Risk>
    <Risk severity="high">The local private repository currently has no Git remote, so it is not remotely backed up.</Risk>
    <Risk severity="high">Live activation is blocked until the Stripe operator key receives Products Write, Prices Write, and Webhook Endpoints Write and both production secret versions are installed.</Risk>
    <Risk severity="medium">Digital delivery is manual within 24 hours; the owner must fulfill each paid order from the notification email.</Risk>
    <Risk severity="medium">Mailbox placement remains controlled by the receiving provider; authenticated delivery can still be classified as junk while the new domain develops reputation.</Risk>
    <Risk severity="medium">Tax registration and automatic tax obligations depend on launch jurisdictions and require owner/legal review.</Risk>
  </RisksAndOpenQuestions>
